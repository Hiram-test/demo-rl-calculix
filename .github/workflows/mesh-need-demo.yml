name: Mesh Need DeepSeek Analysis Demo

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/mesh_need/**"
      - "scripts/run_mesh_need_demo.py"
      - "scripts/run_real_calculix_demo.py"
      - "scripts/run_upper_right_refinement.py"
      - "scripts/call_deepseek.py"
      - "examples/mesh_need/**"
      - "tests/test_mesh_need_diagnosis.py"
      - ".github/workflows/mesh-need-demo.yml"
  push:
    branches:
      - feat/model-aware-fea-mvp
    paths:
      - "src/mesh_need/**"
      - "scripts/run_mesh_need_demo.py"
      - "scripts/run_real_calculix_demo.py"
      - "scripts/run_upper_right_refinement.py"
      - "scripts/call_deepseek.py"
      - "examples/mesh_need/**"
      - "tests/test_mesh_need_diagnosis.py"
      - ".github/workflows/mesh-need-demo.yml"

permissions:
  contents: read

jobs:
  generate-evidence-and-run-deepseek:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CalculiX solver and DeepSeek client
        run: |
          sudo apt-get update
          sudo apt-get install -y calculix-ccx
          command -v ccx
          dpkg-query -W calculix-ccx
          python -m pip install --upgrade pip
          python -m pip install "openai>=1.61,<3"

      - name: Generate CalculiX solver evidence
        run: |
          mkdir -p artifacts/real-calculix
          python scripts/run_real_calculix_demo.py \
            --output-dir artifacts/real-calculix \
            | tee artifacts/real-calculix/ai_analysis_packet_stdout.json

      - name: Generate focused upper-right evidence
        run: |
          mkdir -p artifacts/upper-right-refinement
          python scripts/run_upper_right_refinement.py \
            --output-dir artifacts/upper-right-refinement \
            | tee artifacts/upper-right-refinement/ai_analysis_packet_stdout.json

      - name: Build static-question AI packet
        run: |
          python scripts/run_mesh_need_demo.py \
            | tee artifacts/fatigue_weld_ai_analysis_packet.json

      - name: Test the AI contract
        run: python -m unittest tests/test_mesh_need_diagnosis.py -v

      - name: Confirm DeepSeek secret is available
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY repository secret is missing"
            exit 1
          fi
          echo "DeepSeek repository secret is available"

      - name: Ask DeepSeek to analyze the focused solver evidence
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-pro
        run: |
          python scripts/call_deepseek.py \
            artifacts/upper-right-refinement/ai_analysis_packet.json \
            artifacts/upper-right-refinement/deepseek_analysis.json \
            > artifacts/upper-right-refinement/deepseek_call_summary.json
          cat artifacts/upper-right-refinement/deepseek_call_summary.json
          test -s artifacts/upper-right-refinement/deepseek_analysis.json

      - name: Upload solver evidence, packets, and AI analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-need-deepseek-analysis
          path: artifacts/
          if-no-files-found: error
