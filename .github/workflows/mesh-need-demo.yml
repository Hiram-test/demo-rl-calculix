name: Mesh Need Demo

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/mesh_need/**"
      - "scripts/run_mesh_need_demo.py"
      - "scripts/run_real_calculix_demo.py"
      - "scripts/run_upper_right_refinement.py"
      - "examples/mesh_need/**"
      - "tests/test_mesh_need_diagnosis.py"
      - ".github/workflows/mesh-need-demo.yml"
  push:
    branches:
      - feat/model-aware-fea-mvp
    paths:
      - "src/mesh_need/**"
      - "scripts/run_mesh_need_demo.py"
      - "scripts/run_real_calculix_demo.py"
      - "scripts/run_upper_right_refinement.py"
      - "examples/mesh_need/**"
      - "tests/test_mesh_need_diagnosis.py"
      - ".github/workflows/mesh-need-demo.yml"

permissions:
  contents: read

jobs:
  diagnose-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CalculiX solver
        run: |
          sudo apt-get update
          sudo apt-get install -y calculix-ccx
          command -v ccx
          dpkg-query -W calculix-ccx

      - name: Run real CalculiX mesh study
        run: |
          mkdir -p artifacts/real-calculix
          python scripts/run_real_calculix_demo.py \
            --output-dir artifacts/real-calculix \
            | tee artifacts/real-calculix/stdout.json

      - name: Run focused upper-right refinement study
        run: |
          mkdir -p artifacts/upper-right-refinement
          python scripts/run_upper_right_refinement.py \
            --output-dir artifacts/upper-right-refinement \
            | tee artifacts/upper-right-refinement/stdout.json

      - name: Run the static example diagnosis
        run: |
          python scripts/run_mesh_need_demo.py \
            | tee artifacts/fatigue_weld_diagnosis.json

      - name: Run regression tests
        run: python -m unittest tests/test_mesh_need_diagnosis.py -v

      - name: Upload solver files and diagnoses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-need-real-calculix-results
          path: artifacts/
          if-no-files-found: error
