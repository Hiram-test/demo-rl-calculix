name: Materialize WM-VLA implementation

on:
  push:
    branches:
      - feat/wm-vla-multistep-bridge3d
    paths:
      - .github/workflows/materialize-wm-vla.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/wm-vla-multistep-bridge3d
          fetch-depth: 0
      - name: Verify and materialize reviewed bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path  # Read the staged bundle and write only reviewed repository paths.
          import base64  # Decode the transport-safe staged payload.
          import hashlib  # Verify the exact compressed implementation bundle before extraction.
          import io  # Expose decompressed tar bytes without an intermediate archive file.
          import lzma  # Decompress the compact deterministic implementation bundle.
          import shutil  # Remove all temporary transport files after successful extraction.
          import tarfile  # Restore the reviewed source tree from the verified bundle.
          root = Path.cwd().resolve()  # Bind extraction to the checked-out repository root.
          chunk_dir = root / ".wm_bootstrap"  # Locate the temporary staged bundle fragments.
          payload = "".join((chunk_dir / f"chunk_{index}.b64").read_text(encoding="utf-8") for index in range(1, 5))  # Reassemble fragments in fixed order.
          compressed = base64.b64decode(payload, validate=True)  # Reject malformed transport data explicitly.
          digest = hashlib.sha256(compressed).hexdigest()  # Compute the compressed implementation identity.
          expected = "3d7232e1fffeff1adf85bd7170569ec8fc1201f015aba6f7c03c7189c9bee782"  # Pin the locally reviewed bundle digest.
          if digest != expected:  # Refuse to write unreviewed or truncated content.
              raise RuntimeError(f"WM-VLA bundle hash mismatch: {digest}")  # Report the exact unexpected digest.
          archive = lzma.decompress(compressed)  # Recover the deterministic tar archive in memory.
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as source:  # Inspect every member before extraction.
              for member in source.getmembers():  # Validate all target paths against traversal.
                  target = (root / member.name).resolve()  # Resolve the requested repository destination.
                  if target != root and root not in target.parents:  # Detect any member escaping the repository.
                      raise RuntimeError(f"unsafe bundle member: {member.name}")  # Abort before writing unsafe content.
              source.extractall(root, filter="data")  # Restore only ordinary data members after path validation.
          shutil.rmtree(chunk_dir)  # Remove the temporary staged fragments from the final branch state.
          (root / ".github" / "workflows" / "wm-vla-bridge3d.yml").unlink(missing_ok=True)  # Defer the final CI workflow to the connected GitHub writer.
          (root / ".github" / "workflows" / "materialize-wm-vla.yml").unlink()  # Remove this one-shot bootstrap workflow.
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement multistep world-model VLA for bridge 3D"
          git push origin HEAD:feat/wm-vla-multistep-bridge3d
