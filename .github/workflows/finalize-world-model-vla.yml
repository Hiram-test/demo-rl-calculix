name: finalize-world-model-vla  # Name the one-shot source-finalization workflow.

on:  # Define the single automatic trigger.
  push:  # Run when this workflow is first added to the implementation branch.
    branches:  # Restrict write access to the dedicated WM-VLA branch.
      - "feat/world-model-vla-bridge-diaphragm-ready3"  # Select the sole implementation branch.
    paths:  # Avoid retriggering after the workflow removes itself.
      - ".github/workflows/finalize-world-model-vla.yml"  # Trigger only from creation of this one-shot workflow.
      - "scripts/finalize_world_model_vla.py"  # Trigger when the paired finalizer is created or corrected.
  workflow_dispatch:  # Permit one explicit rerun if the automatic event is delayed.

permissions:  # Grant only the permission required to commit finalized sources.
  contents: write  # Permit the workflow token to update this implementation branch.

jobs:  # Define the isolated one-shot finalization job.
  finalize:  # Apply deterministic source edits and prove focused unit correctness before committing.
    runs-on: ubuntu-latest  # Use a reproducible Linux environment.
    timeout-minutes: 15  # Bound dependency installation and focused testing.
    steps:  # Execute checkout, finalization, verification, and self-removal.
      - name: Check out implementation branch  # Materialize the branch with push credentials retained.
        uses: actions/checkout@v4  # Use the maintained checkout action.
        with:  # Configure the exact branch rather than a detached pull-request merge commit.
          ref: "feat/world-model-vla-bridge-diaphragm-ready3"  # Check out the writable implementation branch.
          fetch-depth: 0  # Retain branch history for a normal commit.
      - name: Set up Python  # Select the supported interpreter.
        uses: actions/setup-python@v5  # Use the maintained Python setup action.
        with:  # Configure the interpreter version.
          python-version: "3.11"  # Match the dedicated verification workflow.
      - name: Apply deterministic finalizer  # Patch only the audited source fragments.
        run: |  # Execute the idempotent repository script.
          python scripts/finalize_world_model_vla.py  # Harden budget, partition, and anchor contracts.
      - name: Install focused test dependencies  # Install the repository and unit runner.
        run: |  # Execute deterministic Python installation commands.
          python -m pip install --upgrade pip  # Upgrade the package installer.
          python -m pip install -e . pytest  # Install the editable project and test runner.
      - name: Verify finalized sources  # Reject syntax, purity, planning, and Dörfler-shield regressions.
        run: |  # Execute focused verification before any commit is made.
          python -m py_compile visionamr/vla/world_controller.py  # Compile the canonical controller.
          python -m py_compile visionamr/bridge_diaphragm.py  # Compile the bridge benchmark.
          python -m pytest -q tests/test_world_controller.py  # Run all focused scientific unit gates.
      - name: Remove one-shot maintenance files  # Keep the final pull request free of temporary machinery.
        run: |  # Delete only the finalizer and this workflow from the checked-out branch.
          rm scripts/finalize_world_model_vla.py  # Remove the temporary source-edit script.
          rm .github/workflows/finalize-world-model-vla.yml  # Remove the one-shot workflow definition.
      - name: Commit finalized implementation  # Persist only the corrected production sources and deletion of temporary files.
        run: |  # Create and push one auditable finalization commit.
          git config user.name "github-actions[bot]"  # Set the standard automation author name.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"  # Set the standard automation author email.
          git add visionamr/vla/world_controller.py visionamr/bridge_diaphragm.py scripts/finalize_world_model_vla.py .github/workflows/finalize-world-model-vla.yml  # Stage finalized sources and one-shot file removals.
          git diff --cached --quiet || git commit -m "fix: finalize WM-VLA execution contracts"  # Commit only when the source tree changed.
          git push origin HEAD:feat/world-model-vla-bridge-diaphragm-ready3  # Update the sole implementation branch.
