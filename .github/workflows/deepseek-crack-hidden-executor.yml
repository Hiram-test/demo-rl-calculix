name: DeepSeek Crack Hidden Executor  # 标识完全隔离的隐藏执行器实验工作流。

on:  # 定义工作流触发条件。
  push:  # 在隔离分支代码更新后运行静态合同和真实模型闭环。
    branches:  # 限制自动运行分支。
      - exp/deepseek-crack-hidden-executor  # 只允许隐藏执行器实验分支触发。
    paths:  # 限制相关文件变更。
      - experiments/hidden_executor/**  # 监听任务控制器和隐藏执行器。
      - scripts/run_deepseek_crack_hidden_executor.py  # 监听基础模型调用器。
      - scripts/run_deepseek_crack_hidden_executor_adapter.py  # 监听任务级编排入口。
      - tests/test_deepseek_crack_hidden_executor.py  # 监听合同测试。
      - docs/DEEPSEEK_CRACK_HIDDEN_EXECUTOR.md  # 监听实验协议文档。
      - .github/workflows/deepseek-crack-hidden-executor.yml  # 监听工作流自身。
  pull_request:  # 在堆叠PR上只执行无凭据静态检查。
    paths:  # 限制PR检查范围。
      - experiments/hidden_executor/**  # 监听任务控制器和隐藏执行器。
      - scripts/run_deepseek_crack_hidden_executor.py  # 监听基础模型调用器。
      - scripts/run_deepseek_crack_hidden_executor_adapter.py  # 监听任务级编排入口。
      - tests/test_deepseek_crack_hidden_executor.py  # 监听合同测试。
      - docs/DEEPSEEK_CRACK_HIDDEN_EXECUTOR.md  # 监听实验协议文档。
      - .github/workflows/deepseek-crack-hidden-executor.yml  # 监听工作流自身。
  workflow_dispatch:  # 允许从GitHub界面手动复跑。

concurrency:  # 防止多个真实模型循环同时写入同一结果目录。
  group: deepseek-crack-hidden-executor-${{ github.ref }}  # 按分支建立唯一并发组。
  cancel-in-progress: true  # 新运行启动时取消旧运行。

permissions:  # 设置默认最小权限。
  contents: read  # 静态作业只读取代码。

jobs:  # 定义静态和真实实验作业。
  static-contracts:  # 运行不需要模型凭据的隔离合同测试。
    runs-on: ubuntu-24.04  # 使用固定Ubuntu运行环境。
    timeout-minutes: 20  # 限制静态检查时间。
    steps:  # 定义静态检查步骤。
      - uses: actions/checkout@v4  # 检出当前提交。
      - uses: actions/setup-python@v5  # 配置Python环境。
        with:  # 提供Python版本。
          python-version: "3.11"  # 与现有有限元实验保持一致。
      - name: Install isolated test dependencies  # 安装合同测试所需依赖。
        run: python -m pip install --quiet numpy scipy openai  # 安装数值库和API客户端。
      - name: Compile hidden-executor task stack  # 编译全部隔离任务控制和执行层文件。
        run: python -m py_compile experiments/hidden_executor/contracts.py experiments/hidden_executor/executor.py experiments/hidden_executor/executor_adapter.py experiments/hidden_executor/executor_adapter_v2.py experiments/hidden_executor/executor_adapter_v3.py experiments/hidden_executor/executor_adapter_v4.py experiments/hidden_executor/executor_adapter_v5.py experiments/hidden_executor/task_controller.py scripts/run_deepseek_crack_hidden_executor.py scripts/run_deepseek_crack_hidden_executor_adapter.py tests/test_deepseek_crack_hidden_executor.py  # 在真实调用前捕获语法错误。
      - name: Validate isolation and task-completion contracts  # 执行冻结、隐藏映射、路线切换和任务完成门测试。
        run: python -m unittest tests/test_deepseek_crack_hidden_executor.py -v  # 运行新实验专属测试文件。

  live-hidden-executor:  # 运行真实DeepSeek无工具可见闭环。
    if: github.event_name != 'pull_request'  # 禁止PR事件读取Environment Secret。
    needs: static-contracts  # 只有静态合同通过后才允许真实调用。
    runs-on: ubuntu-24.04  # 使用固定Ubuntu运行环境。
    environment: ds  # 复用既有受保护DeepSeek凭据环境。
    timeout-minutes: 120  # 为八轮模型和有限元闭环保留充足时间。
    permissions:  # 只为结果冻结授予写权限。
      contents: write  # 允许把脱敏轨迹提交到当前隔离分支。
    env:  # 配置模型凭据和模型名称。
      DEEPSEEK_API_KEY: ${{ secrets.D || secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_KEY || secrets.DEEPSEEK || secrets.API_KEY || secrets.API || secrets.KEY || secrets.TOKEN || secrets.DS || secrets.DS_KEY || secrets.DS_API_KEY || vars.D || vars.DEEPSEEK_API_KEY || vars.DEEPSEEK_KEY || vars.DEEPSEEK || vars.API_KEY || vars.API || vars.KEY || vars.TOKEN || vars.DS || vars.DS_KEY || vars.DS_API_KEY }}  # 兼容仓库现有凭据名称但不打印值。
      DEEPSEEK_MODEL: deepseek-v4-pro  # 固定本次验证模型。
    steps:  # 定义真实实验步骤。
      - uses: actions/checkout@v4  # 检出隔离分支并保留推送凭据。
        with:  # 提供明确分支设置。
          ref: exp/deepseek-crack-hidden-executor  # 始终在新隔离分支冻结结果。
      - uses: actions/setup-python@v5  # 配置Python环境。
        with:  # 提供Python版本。
          python-version: "3.11"  # 与静态作业保持一致。
      - name: Install live experiment dependencies  # 安装真实求解和模型调用依赖。
        run: python -m pip install --quiet numpy scipy openai  # 安装数值库和API客户端。
      - name: Prepare isolated run receipt  # 在模型调用前保存当前运行身份。
        shell: bash  # 使用Bash创建审计目录。
        run: |  # 开始运行收据命令。
          set -euo pipefail  # 在目录或收据写入失败时立即停止。
          rm -rf artifacts/deepseek_crack_hidden_executor  # 清理runner上的旧隔离结果。
          mkdir -p artifacts/deepseek_crack_hidden_executor  # 创建本次实验目录。
          python - <<'PY'  # 使用标准库生成不含密钥的运行收据。
          import json, os  # 读取Actions环境并写入JSON。
          from pathlib import Path  # 管理收据输出路径。
          receipt = {"workflow": os.environ.get("GITHUB_WORKFLOW"), "run_id": os.environ.get("GITHUB_RUN_ID"), "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"), "head_sha": os.environ.get("GITHUB_SHA"), "ref": os.environ.get("GITHUB_REF"), "event": os.environ.get("GITHUB_EVENT_NAME"), "model": os.environ.get("DEEPSEEK_MODEL")}  # 组织脱敏运行身份。
          Path("artifacts/deepseek_crack_hidden_executor/run_receipt.json").write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")  # 保存运行收据。
          PY
      - name: Confirm DeepSeek credential without disclosure  # 检查受保护凭据确实存在。
        id: credential_check  # 保存凭据检查结果。
        continue-on-error: true  # 即使凭据缺失也继续冻结诊断。
        run: test -n "$DEEPSEEK_API_KEY"  # 只检查非空且不输出密钥。
      - name: Run task-gated hidden execution loop  # 执行提案冻结、隐藏映射、路线切换和总体任务门闭环。
        id: live_run  # 保存真实运行结果。
        if: steps.credential_check.outcome == 'success'  # 只有凭据存在时才调用模型。
        continue-on-error: true  # 即使失败也先保留脱敏轨迹。
        shell: bash  # 使用Bash捕获退出码。
        run: |  # 开始真实实验命令。
          set -o pipefail  # 确保Python失败传递到退出码。
          python scripts/run_deepseek_crack_hidden_executor_adapter.py --model "$DEEPSEEK_MODEL" --max-rounds 8 --output artifacts/deepseek_crack_hidden_executor 2>&1 | tee artifacts/deepseek_crack_hidden_executor/live.log  # 使用八轮任务级编排运行真实闭环。
          status="${PIPESTATUS[0]}"  # 读取Python进程退出码。
          printf '%s\n' "$status" > artifacts/deepseek_crack_hidden_executor/live_exit_code.txt  # 保存退出码供审计。
          exit "$status"  # 把真实运行状态交给Actions。
      - name: Write final run status  # 无论模型执行结果如何都生成脱敏状态文件。
        if: always()  # 始终执行状态记录。
        env:  # 读取前序步骤结果。
          CREDENTIAL_OUTCOME: ${{ steps.credential_check.outcome }}  # 保存凭据检查状态。
          LIVE_OUTCOME: ${{ steps.live_run.outcome }}  # 保存真实模型循环状态。
        shell: bash  # 使用Bash和Python写入状态。
        run: |  # 开始状态写入命令。
          python - <<'PY'  # 使用标准库生成状态JSON。
          import json, os  # 读取步骤结果环境变量。
          from pathlib import Path  # 管理状态文件路径。
          path = Path("artifacts/deepseek_crack_hidden_executor/final_status.json")  # 定位隔离状态文件。
          path.parent.mkdir(parents=True, exist_ok=True)  # 确保目录存在。
          path.write_text(json.dumps({"credential_outcome": os.environ.get("CREDENTIAL_OUTCOME"), "live_outcome": os.environ.get("LIVE_OUTCOME")}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")  # 保存脱敏最终状态。
          PY
      - name: Freeze trace and diagnostics on isolated branch  # 把成功或失败诊断提交到新分支便于审计。
        if: always() && github.event_name == 'push'  # 只在隔离分支push运行时提交结果。
        shell: bash  # 使用Bash执行受控文件复制和提交。
        run: |  # 开始结果冻结命令。
          set -euo pipefail  # 在复制或提交失败时立即停止。
          git fetch origin exp/deepseek-crack-hidden-executor  # 获取当前隔离分支最新状态。
          git rebase origin/exp/deepseek-crack-hidden-executor  # 避免与较早审计提交冲突。
          target=experiments/results/latest_deepseek_crack_hidden_executor  # 定义独立结果目录。
          rm -rf "$target"  # 清除该隔离结果目录上一版本。
          mkdir -p "$target"  # 创建结果冻结目录。
          cp -R artifacts/deepseek_crack_hidden_executor/. "$target"/  # 复制提案、封条、任务状态和诊断文件。
          rm -f "$target/live.log"  # 不提交运行日志以减少噪声和潜在敏感输出。
          git config user.name github-actions[bot]  # 设置自动提交用户名。
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com  # 设置自动提交邮箱。
          git add "$target"  # 只暂存新实验结果目录。
          if ! git diff --cached --quiet; then git commit -m "Freeze hidden executor trace [skip ci]"; git push origin HEAD:exp/deepseek-crack-hidden-executor; fi  # 仅在结果变化时提交且跳过递归CI。
      - name: Upload isolated trace and audit chain  # 上传冻结提案、映射收据和任务状态。
        if: always()  # 无论成功或失败都保留证据。
        uses: actions/upload-artifact@v4  # 使用官方Artifact上传动作。
        with:  # 配置Artifact参数。
          name: deepseek-crack-hidden-executor  # 设置可识别的Artifact名称。
          path: artifacts/deepseek_crack_hidden_executor  # 只上传隔离结果目录。
          if-no-files-found: error  # 在连收据都没有时明确失败。
          retention-days: 30  # 保留一个月用于审计。
      - name: Enforce successful live experiment  # 在审计提交和Artifact上传后恢复严格失败语义。
        if: always()  # 始终检查凭据和真实运行结果。
        env:  # 读取前序步骤结果。
          CREDENTIAL_OUTCOME: ${{ steps.credential_check.outcome }}  # 保存凭据检查状态。
          LIVE_OUTCOME: ${{ steps.live_run.outcome }}  # 保存真实模型循环状态。
        run: test "$CREDENTIAL_OUTCOME" = "success" && test "$LIVE_OUTCOME" = "success"  # 只有凭据和完整闭环成功时工作流才通过。
