name: Entity-first pipeline staged audit  # Identify the isolated pre-repair verification workflow.
on:  # Define explicit triggers for the isolated branch only.
  pull_request:  # Run checks on the draft repair pull request.
    branches:  # Restrict the base branch that receives this repair.
      - feat/ai-dynamic-region-mesh-paper  # Keep the repair isolated from main and unrelated research branches.
  workflow_dispatch:  # Allow a manual rerun without modifying source files.
permissions:  # Grant only the access required to download the frozen baseline artifact.
  actions: read  # Allow the workflow to read an earlier workflow artifact.
  contents: read  # Allow checkout of the isolated repair branch.
jobs:  # Execute each repair stage behind the preceding hard gate.
  verify-audit-code:  # Prove the guard itself works before it judges production evidence.
    runs-on: ubuntu-latest  # Use a clean hosted Linux runner.
    steps:  # Execute deterministic tests with no Gmsh, CalculiX, LLM, or PSO.
      - uses: actions/checkout@v4  # Check out only the isolated repair branch.
      - uses: actions/setup-python@v5  # Install a controlled Python interpreter.
        with:  # Configure the interpreter explicitly.
          python-version: "3.12"  # Use the project-compatible Python line.
      - name: Install NPZ reader  # Install the only Stage 1 runtime dependency.
        run: python -m pip install --disable-pip-version-check numpy  # Keep the first stage independent from meshing and solving tools.
      - name: Compile audit script  # Detect syntax and import errors before self-tests.
        run: python -m py_compile scripts/entity_first_stage1_audit.py  # Compile the exact diagnostic entry point.
      - name: Run audit self-tests  # Verify fake-hole, hole-drift, and sliver detection.
        run: python scripts/entity_first_stage1_audit.py --self-test  # Execute deterministic internal regressions.
  diagnose-frozen-v4:  # Inspect the exact archived meshes without rerunning optimization or solvers.
    runs-on: ubuntu-latest  # Use a runner isolated from the self-test job.
    steps:  # Download the baseline and require the new guard to reject it.
      - uses: actions/checkout@v4  # Check out only the isolated repair branch.
      - uses: actions/setup-python@v5  # Install a controlled Python interpreter.
        with:  # Configure the interpreter explicitly.
          python-version: "3.12"  # Match the audit-code job.
      - name: Install NPZ reader  # Install the frozen-artifact reader.
        run: python -m pip install --disable-pip-version-check numpy  # Avoid Gmsh and CalculiX until Stage 1 is complete.
      - name: Download frozen V4 artifact  # Retrieve the exact evidence produced by run 30576340910.
        env:  # Supply the built-in token only for this repository-scoped read.
          GH_TOKEN: ${{ github.token }}  # Avoid external credentials and write access.
        run: gh run download 30576340910 --repo "$GITHUB_REPOSITORY" --name deepseek-ai-region-mesh-agent-v4-paper --dir frozen_v4  # Preserve the baseline unchanged.
      - name: Require rejection of the broken baseline  # Make detection of current defects the Stage 1 success condition.
        shell: bash  # Use explicit status handling for the expected audit failure.
        run: |  # Run the hard gate and assert that at least one current mesh is invalid.
          set +e  # Capture the diagnostic status instead of aborting immediately.
          python scripts/entity_first_stage1_audit.py --artifact-root frozen_v4 --report stage1_reports/frozen_v4_mesh_audit.json  # Audit exact best-particle NPZ meshes.
          audit_status=$?  # Preserve the hard-gate process status.
          set -e  # Restore fail-fast shell behavior.
          test "$audit_status" -ne 0  # Fail CI if the broken baseline is incorrectly accepted.
      - uses: actions/upload-artifact@v4  # Publish machine-readable evidence for review.
        with:  # Configure the isolated audit artifact.
          name: entity-first-stage1-audit  # Give the report a stable artifact name.
          path: stage1_reports/frozen_v4_mesh_audit.json  # Upload the complete diagnostic receipt.
          if-no-files-found: error  # Refuse a green workflow without evidence.
  build-exact-gmsh-entities:  # Start Stage 2 only after both Stage 1 jobs pass.
    needs: [verify-audit-code, diagnose-frozen-v4]  # Enforce audit-first sequencing inside one workflow.
    runs-on: ubuntu-latest  # Use a clean runner with no legacy generated files.
    steps:  # Build one OpenCASCADE BREP per IMP and mesh the same BREP twice.
      - uses: actions/checkout@v4  # Check out only the isolated repair branch.
      - uses: actions/setup-python@v5  # Install a controlled Python interpreter.
        with:  # Configure the interpreter explicitly.
          python-version: "3.12"  # Match Stage 1 Python behavior.
      - name: Install mature geometry and mesh tools  # Install Gmsh only after Stage 1 has completed.
        run: |  # Use the Ubuntu repository package and record the exact version.
          sudo apt-get update  # Refresh package metadata on the clean runner.
          sudo apt-get install -y gmsh  # Install the public OpenCASCADE-based mesher.
          gmsh --version  # Preserve the exact tool version in the Actions log.
          python -m pip install --disable-pip-version-check numpy  # Install the Stage 1 mesh-audit dependency.
      - name: Compile Stage 2 builder and launcher  # Detect Python errors before invoking Gmsh.
        run: python -m py_compile scripts/entity_first_stage2_gmsh.py scripts/entity_first_stage2_run.py  # Compile model logic and the explicit batch adapter.
      - name: Build and validate exact entities  # Generate bearing, single-hole, and three-hole BREP models.
        run: python scripts/entity_first_stage2_run.py --self-test --output-dir stage2_outputs  # Mesh each frozen entity at two independent size levels in batch mode.
      - uses: actions/upload-artifact@v4  # Publish all geometry, mesh, and validation evidence even on failure.
        if: always()  # Preserve generated source and partial evidence for reproducible debugging.
        with:  # Configure the isolated Stage 2 artifact.
          name: entity-first-stage2-gmsh  # Give the entity-first evidence a stable name.
          path: stage2_outputs  # Upload BREP, GEO, MSH, and JSON receipts.
          if-no-files-found: warn  # Keep failure logs useful even if Gmsh stopped before file creation.
  run-calculix-smoke-solves:  # Start Stage 3 only after the exact Gmsh entity job passes.
    needs: [build-exact-gmsh-entities]  # Prevent CalculiX from seeing an unaudited or geometry-drifting mesh.
    runs-on: ubuntu-latest  # Use a clean solver runner isolated from geometry creation.
    steps:  # Verify deck generation, run CalculiX, and check result equilibrium.
      - uses: actions/checkout@v4  # Check out only the isolated repair branch.
      - uses: actions/setup-python@v5  # Install a controlled Python interpreter.
        with:  # Configure the interpreter explicitly.
          python-version: "3.12"  # Match earlier stage behavior.
      - uses: actions/download-artifact@v4  # Consume only the Stage 2 evidence from this workflow run.
        with:  # Select the exact validated geometry artifact.
          name: entity-first-stage2-gmsh  # Download BREP and audited MSH evidence.
          path: stage2_inputs  # Isolate downloaded model evidence from solver outputs.
      - name: Install mature CalculiX solver  # Install the public solver only after Gmsh validation passes.
        run: |  # Record package and executable evidence in the Actions log.
          sudo apt-get update  # Refresh package metadata on the clean runner.
          sudo apt-get install -y calculix-ccx  # Install the Ubuntu CalculiX solver package.
          command -v ccx  # Require the solver executable to exist on PATH.
          ccx -v || true  # Record the solver version without treating version-output conventions as a failure.
      - name: Compile and self-test CalculiX deck generator  # Test our conversion code before any full solve.
        run: |  # Execute code-only checks first.
          python -m py_compile scripts/entity_first_stage3_calculix.py  # Detect syntax and import errors.
          python scripts/entity_first_stage3_calculix.py --generator-self-test  # Verify element, set, boundary, load, and output cards.
      - name: Run three isolated CalculiX smoke solves  # Solve bearing, single-hole, and three-hole exact entities.
        run: python scripts/entity_first_stage3_calculix.py --stage2-root stage2_inputs --output-dir stage3_outputs  # Require finite response, result files, and force equilibrium.
      - uses: actions/upload-artifact@v4  # Publish decks, logs, fields, and receipts for review.
        if: always()  # Preserve partial solver evidence when the hard gate catches a defect.
        with:  # Configure the isolated Stage 3 artifact.
          name: entity-first-stage3-calculix  # Give solver evidence a stable artifact name.
          path: stage3_outputs  # Upload INP, DAT, FRD, logs, and JSON receipt.
          if-no-files-found: warn  # Preserve a useful failing workflow even before files are emitted.