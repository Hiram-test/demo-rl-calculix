name: V4 Payload Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ai-dynamic-region-mesh-paper
    paths:
      - ".github/workflows/v4-payload-diagnostic.yml"
      - ".github/agent_v4_payload/**"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Print payload blob hashes and reconstructed digest
        run: |
          set -euo pipefail
          find .github/agent_v4_payload -maxdepth 1 -type f -name 'source_*.b64' -print0 \
            | sort -z \
            | while IFS= read -r -d '' f; do
                printf '%s  %s\n' "$(git hash-object "$f")" "$f"
              done
          cat .github/agent_v4_payload/source_*.b64 | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/bridge-agent-v4-source.tar.xz"
          printf 'archive_sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/bridge-agent-v4-source.tar.xz" | awk '{print $1}')"
          printf 'archive_size=%s\n' "$(stat -c %s "$RUNNER_TEMP/bridge-agent-v4-source.tar.xz")"
          xz -t "$RUNNER_TEMP/bridge-agent-v4-source.tar.xz" || true
