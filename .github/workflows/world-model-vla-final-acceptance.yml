name: world-model-vla-final-acceptance  # Name the one-shot reference-based final scientific acceptance workflow.

on:  # Define automatic and manual entry points.
  push:  # Run when this final gate is added to the implementation branch.
    branches:  # Restrict execution to the dedicated WM-VLA branch.
      - "feat/world-model-vla-bridge-diaphragm-ready3"  # Select the sole implementation branch.
    paths:  # Avoid retriggering after self-removal.
      - ".github/workflows/world-model-vla-final-acceptance.yml"  # Trigger only from this one-shot gate definition.
  workflow_dispatch:  # Permit an explicit rerun if required.

permissions:  # Grant only the branch mutation needed to retain measured evidence.
  contents: write  # Permit the workflow token to commit the concise final record and remove itself.

jobs:  # Define the isolated final bridge campaign.
  final-acceptance:  # Run source gates, independent training, frozen-snapshot tests, and complete acceptance.
    runs-on: ubuntu-latest  # Use a reproducible Linux environment.
    timeout-minutes: 180  # Bound the medium-complexity three-dimensional reference campaign.
    env:  # Bound native solver parallelism for stable wall-clock comparison.
      OMP_NUM_THREADS: "2"  # Use the same thread count for all competing methods.
      OPENBLAS_NUM_THREADS: "2"  # Bound linear-algebra helper threads consistently.
    steps:  # Execute checkout, installation, source gates, campaign, evidence, cleanup, and enforcement.
      - name: Check out implementation branch  # Materialize the writable branch rather than a detached merge commit.
        uses: actions/checkout@v4  # Use the maintained checkout action.
        with:  # Configure the exact implementation branch.
          ref: "feat/world-model-vla-bridge-diaphragm-ready3"  # Select the sole WM-VLA branch.
          fetch-depth: 0  # Retain branch history for an evidence commit.
      - name: Set up Python  # Select the supported scientific interpreter.
        uses: actions/setup-python@v5  # Use the maintained Python setup action.
        with:  # Configure the interpreter version.
          python-version: "3.11"  # Match permanent project verification.
      - name: Install native finite-element tools  # Install the actual mesher and structural solver.
        run: |  # Execute deterministic Ubuntu package installation.
          sudo apt-get update  # Refresh package metadata.
          sudo apt-get install -y calculix-ccx gmsh libglu1-mesa  # Install CalculiX, Gmsh, and the Gmsh runtime library.
      - name: Install repository  # Install Python dependencies and the focused test runner.
        run: |  # Execute deterministic Python installation commands.
          python -m pip install --upgrade pip  # Upgrade the package installer.
          python -m pip install -e . pytest  # Install the editable repository and Pytest.
      - name: Verify final source contracts  # Reject syntax, leakage, split, and gate-definition regressions.
        id: source_gate  # Expose the source outcome to later evidence steps.
        continue-on-error: true  # Preserve a final evidence record after any source failure.
        run: |  # Execute deterministic source and unit checks.
          python -m py_compile visionamr/vla/world_controller.py  # Compile the canonical action-conditioned controller.
          python -m py_compile visionamr/bridge_diaphragm.py  # Compile the medium-complexity bridge component.
          python -m py_compile visionamr/local_prediction_runner.py  # Compile the independent LP baseline.
          python -m py_compile scripts/run_world_model_vla_bridge.py  # Compile the complete held-out campaign.
          python -m pytest -q tests/test_world_controller.py  # Run action, planning, persistence, purity, domination, and Pareto gates.
          grep -q "test_world = RegionalWorldModel.load(model_path, config=config)" scripts/run_world_model_vla_bridge.py  # Require an independent frozen model snapshot for each test case.
          grep -q "def aggregate_local_prediction_gate" scripts/run_world_model_vla_bridge.py  # Require the four-dimensional LP comparison.
          grep -q "require-lp-overtake" scripts/run_world_model_vla_bridge.py  # Require the explicit LP acceptance switch.
          ! grep -q "local_prediction_runner" visionamr/vla/world_controller.py  # Forbid LP evaluation code from entering WM-VLA.
          ! grep -q "predicted_sizes(" visionamr/vla/world_controller.py  # Forbid the LP continuous field from entering WM-VLA.
      - name: Run final reference-based campaign  # Execute the frozen scientific comparison on held-out bridge components.
        id: campaign_gate  # Expose the physical campaign outcome.
        if: steps.source_gate.outcome == 'success'  # Launch native solves only after all source contracts pass.
        continue-on-error: true  # Preserve the full physical evidence after a Dörfler or LP gate failure.
        run: |  # Run independent transition collection and frozen-snapshot held-out evaluation.
          python scripts/run_world_model_vla_bridge.py --seed 20260830 --train-cases 2 --test-cases 2 --max-solves 6 --horizon 4 --n-eq-cap 150000 --require-lp-overtake --output artifacts/world_model_vla_final  # Use reference metrics because --no-reference is intentionally absent.
      - name: Write concise final acceptance evidence  # Extract only measured scientific acceptance fields and per-case outcomes.
        if: always()  # Retain evidence after source, execution, Dörfler, LP, or world-action failures.
        run: |  # Execute a deterministic line-commented evidence writer.
          python - <<'PY'  # Start the inline final evidence program.
          from pathlib import Path  # Import portable filesystem paths.
          import json  # Import structured campaign parsing and serialization.
          source = Path("artifacts/world_model_vla_final/campaign.json")  # Select the canonical final campaign result.
          payload = json.loads(source.read_text(encoding="utf-8")) if source.exists() else {}  # Read measured results only when execution produced them.
          cases = []  # Allocate compact held-out case summaries.
          world_action_total = 0  # Initialize the count of actually executed delegated actions.
          for case in payload.get("tests", []):  # Visit every measured held-out bridge component.
              dorfler_comparison = case.get("comparison", {})  # Read its Dörfler Pareto-envelope comparison.
              lp_comparison = case.get("local_prediction_comparison", {})  # Read its independent LP Pareto-envelope comparison.
              world = case.get("world", {})  # Read the world-controller execution summary.
              world_actions = int(world.get("world_actions", 0) or 0)  # Normalize the executed delegated-action count.
              world_action_total += world_actions  # Accumulate real non-zero world actions across held-out cases.
              cases.append({"index": case.get("index"), "dorfler_not_weaker": dorfler_comparison.get("not_weaker"), "dorfler_best_gain": dorfler_comparison.get("best_gain"), "dorfler_solve_saving": dorfler_comparison.get("solve_saving"), "lp_not_weaker": lp_comparison.get("not_weaker"), "lp_best_gain": lp_comparison.get("best_gain"), "lp_solve_saving": lp_comparison.get("solve_saving"), "world_actions": world_actions, "dorfler_fallbacks": world.get("dorfler_fallbacks"), "world_transition_rows": world.get("transition_rows"), "dorfler_total_wall_s": case.get("dorfler_total_wall_s"), "local_prediction_total_wall_s": case.get("local_prediction_total_wall_s"), "world_total_wall_s": case.get("world_total_wall_s")})  # Preserve only auditable per-case acceptance quantities.
          accepted = bool(source.exists()) and bool(payload.get("dorfler_floor_pass")) and bool(payload.get("local_prediction_overtake_gate")) and world_action_total > 0 and payload.get("local_prediction_used") is False  # Apply all physical acceptance conditions jointly.
          evidence = {"schema": 1, "source_gate_outcome": "${{ steps.source_gate.outcome }}", "campaign_step_outcome": "${{ steps.campaign_gate.outcome }}", "execution_completed": source.exists(), "reference_metric_requested": True, "train_cases": 2, "test_cases": 2, "max_real_solves_per_method": 6, "planning_horizon": 4, "equation_cap": 150000, "dorfler_floor_pass": payload.get("dorfler_floor_pass"), "world_model_advantage_observed": payload.get("world_model_advantage_observed"), "local_prediction_composite": payload.get("local_prediction_composite"), "local_prediction_overtake_gate": payload.get("local_prediction_overtake_gate"), "world_model_rows": payload.get("world_model_rows"), "training_total_wall_s": payload.get("training_total_wall_s"), "heldout_world_actions": world_action_total, "local_prediction_used_by_world": payload.get("local_prediction_used"), "local_prediction_baseline_executed": payload.get("local_prediction_baseline_executed"), "accepted": accepted, "cases": cases, "source": str(source)}  # Build the truthful concise final acceptance record.
          destination = Path("docs/WM_VLA_FINAL_ACCEPTANCE.json")  # Select the stable final review evidence path.
          destination.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")  # Persist the exact measured final result.
          PY
      - name: Remove one-shot final gate  # Keep the final branch free of temporary orchestration.
        if: always()  # Clean the gate definition after every outcome.
        run: |  # Delete only this one-shot workflow.
          rm -f .github/workflows/world-model-vla-final-acceptance.yml  # Remove the temporary final acceptance workflow.
      - name: Commit measured final evidence  # Persist the concise truthful result before returning workflow status.
        if: always()  # Commit evidence after accepted or rejected campaigns.
        run: |  # Create and push one auditable evidence commit.
          git config user.name "github-actions[bot]"  # Set the standard automation author name.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"  # Set the standard automation author email.
          git add -A  # Stage the concise final evidence and one-shot workflow removal.
          git diff --cached --quiet || git commit -m "test: record final WM-VLA bridge acceptance"  # Commit only a material evidence change.
          git pull --rebase origin feat/world-model-vla-bridge-diaphragm-ready3  # Reconcile any preceding finalizer or evidence commit.
          git push origin HEAD:feat/world-model-vla-bridge-diaphragm-ready3  # Update the sole implementation branch.
      - name: Enforce final scientific acceptance  # Return a green check only for a complete accepted result.
        if: always()  # Evaluate the committed evidence after every prior outcome.
        run: |  # Parse the concise evidence and return a deterministic status.
          python - <<'PY'  # Start the inline final acceptance program.
          from pathlib import Path  # Import portable path handling.
          import json  # Import structured evidence parsing.
          evidence = json.loads(Path("docs/WM_VLA_FINAL_ACCEPTANCE.json").read_text(encoding="utf-8"))  # Read the exact final evidence record.
          raise SystemExit(0 if bool(evidence.get("accepted")) and evidence.get("source_gate_outcome") == "success" else 2)  # Pass only the complete frozen scientific protocol.
          PY
      - name: Upload complete final evidence  # Preserve meshes, solver decks, logs, metrics, and transition snapshots.
        if: always()  # Upload artifacts after accepted and rejected campaigns.
        uses: actions/upload-artifact@v4  # Use the maintained artifact uploader.
        with:  # Configure the complete physical evidence bundle.
          name: world-model-vla-final-evidence  # Name the downloadable scientific artifact.
          path: artifacts/world_model_vla_final  # Upload the complete isolated final campaign directory.
          if-no-files-found: warn  # Surface an explicit warning when execution failed before artifact creation.
