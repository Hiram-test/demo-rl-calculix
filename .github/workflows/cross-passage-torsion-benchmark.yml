name: Cross-passage torsion five-method benchmark
on:
  workflow_dispatch:
  push:
    branches:
      - exp/cross-passage-torsion-five-methods
    paths:
      - experiments/cross_passage_torsion_benchmark/rerun_accuracy_only_weights_v2.trigger
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch objective only
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('experiments/cross_passage_torsion_benchmark/run_benchmark.py'); s=p.read_text(encoding='utf-8'); old='0.15 * (1.0 - hotspot_recall)  # 仅使用整体刚度、能量分布、位移场和热点精度指标形成目标'; new='0.13 * (1.0 - hotspot_recall)  # 删除资源项并保留原四项精度指标相对权重'; assert old in s or new in s; s=s.replace(old,new,1); assert 'resource_fraction = solution.element_count / float(self.element_cap)' not in s; assert 'reward = 8.0 * (current_objective - candidate_objective)  # 仅以精度目标改进定义奖励，单元数由硬上限约束' in s; p.write_text(s,encoding='utf-8')"
      - name: Compile
        run: python -m py_compile experiments/cross_passage_torsion_benchmark/run_benchmark.py
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          python -m pip install numpy matplotlib --quiet
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu --quiet
          sudo apt-get update -qq >/tmp/apt-update.log 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq calculix-ccx >/tmp/apt-install.log 2>&1
      - name: Locate CalculiX
        id: solver
        shell: bash
        run: |
          set -euo pipefail
          CCX_BIN="$(command -v ccx || true)"
          if [[ -z "$CCX_BIN" ]]; then CCX_BIN="$(find /usr/bin -maxdepth 1 -type f -name 'ccx*' | sort | head -n 1)"; fi
          test -x "$CCX_BIN"
          echo "ccx=$CCX_BIN" >> "$GITHUB_OUTPUT"
      - name: Run benchmark
        shell: bash
        run: |
          set -euo pipefail
          rm -rf experiments/cross_passage_torsion_benchmark/results
          python experiments/cross_passage_torsion_benchmark/run_benchmark.py --ccx '${{ steps.solver.outputs.ccx }}' --output experiments/cross_passage_torsion_benchmark/results | tee /tmp/cross-passage-torsion.log
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json; from pathlib import Path; root=Path('experiments/cross_passage_torsion_benchmark/results'); d=json.loads((root/'results.json').read_text()); assert {x['name'] for x in d['methods']}=={'uniform_mesh','pure_pso','hotspot_pso','graph_multi_agent','dqn_gcn'}; assert all(x['solution']['element_count']<=336 for x in d['methods']); assert (root/'RESULTS.md').is_file()"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-passage-torsion-five-method-evidence
          path: |
            experiments/cross_passage_torsion_benchmark/results/
            /tmp/cross-passage-torsion.log
            /tmp/apt-install.log
          if-no-files-found: warn
          retention-days: 14
      - name: Commit source and results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/cross_passage_torsion_benchmark/run_benchmark.py experiments/cross_passage_torsion_benchmark/results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'results: rerun torsion benchmark with accuracy-only objective'
          git push origin HEAD:${{ github.ref_name }}
