name: Cross-passage torsion five-method benchmark # 定义横向通道纯扭转五方法实验工作流
on: # 定义工作流触发条件
  workflow_dispatch: # 仅允许人工确认后从 GitHub 页面完整复跑
permissions: # 定义工作流最小必要权限
  contents: write # 允许成功运行后将可复现结果提交回实验分支
jobs: # 定义工作流作业集合
  benchmark: # 定义唯一完整实验作业
    runs-on: ubuntu-24.04 # 固定使用 Ubuntu 24.04 虚拟机
    timeout-minutes: 90 # 为参考解、五方法搜索和在线训练设置九十分钟上限
    env: # 定义确定性数值环境
      MPLBACKEND: Agg # 强制 Matplotlib 使用无头后端
      OMP_NUM_THREADS: '1' # 限制 OpenMP 线程数以减少运行波动
      MKL_NUM_THREADS: '1' # 限制 MKL 线程数以提高重复性
    steps: # 定义顺序执行步骤
      - uses: actions/checkout@v4 # 检出当前实验分支
        with: # 配置检出行为
          fetch-depth: 0 # 获取完整历史以便提交结果
      - uses: actions/setup-python@v5 # 安装固定 Python 环境
        with: # 配置解释器版本
          python-version: '3.11' # 使用 Python 3.11
      - name: Compile implementation # 在安装求解器前检查实验主程序语法
        shell: bash # 使用 Bash 执行编译检查
        run: | # 开始编译检查命令
          set -euo pipefail # 任一语法错误立即停止
          python -m py_compile experiments/cross_passage_torsion_benchmark/run_benchmark.py # 编译检查完整五方法实现
      - name: Install real solver dependencies # 安装真实 CalculiX 与数值依赖
        shell: bash # 使用 Bash 执行依赖安装
        run: | # 开始依赖安装命令
          set -euo pipefail # 任一安装错误立即停止
          python -m pip install --upgrade pip --quiet # 更新 pip 以稳定解析轮包
          python -m pip install numpy matplotlib --quiet # 安装数组与无头绘图依赖
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu --quiet # 安装 CPU 版 PyTorch 以运行 GCN-DQN
          sudo apt-get update -qq >/tmp/apt-update.log 2>&1 # 更新 Ubuntu 软件包索引并保存日志
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq calculix-ccx >/tmp/apt-install.log 2>&1 # 安装真实 CalculiX 并保存日志
      - name: Locate CalculiX executable # 定位可能带版本后缀的 ccx 可执行文件
        id: solver # 保存求解器路径供后续步骤引用
        shell: bash # 使用 Bash 执行定位逻辑
        run: | # 开始求解器定位命令
          set -euo pipefail # 找不到求解器时立即停止
          CCX_BIN="$(command -v ccx || true)" # 首先查找标准 ccx 命令
          if [[ -z "$CCX_BIN" ]]; then CCX_BIN="$(find /usr/bin -maxdepth 1 -type f -name 'ccx*' | sort | head -n 1)"; fi # 回退查找 Ubuntu 版本化命令
          test -x "$CCX_BIN" # 验证定位结果可执行
          echo "ccx=$CCX_BIN" >> "$GITHUB_OUTPUT" # 将求解器路径写入步骤输出
          "$CCX_BIN" -v || true # 在日志中记录求解器版本
      - name: Run complete comparison # 执行隐藏参考解和五种方法全部真实候选求解
        shell: bash # 使用 Bash 启动实验脚本
        run: | # 开始完整实验命令
          set -euo pipefail # 任一求解或后处理错误立即停止
          rm -rf experiments/cross_passage_torsion_benchmark/results # 删除旧结果以禁止混入历史候选
          python experiments/cross_passage_torsion_benchmark/run_benchmark.py --ccx '${{ steps.solver.outputs.ccx }}' --output experiments/cross_passage_torsion_benchmark/results | tee /tmp/cross-passage-torsion.log # 运行完整实验并保存标准输出
      - name: Validate result contract # 验证五方法、资源上限、独立指标和交付文件
        shell: bash # 使用 Bash 调用单行 Python 验证器
        run: | # 开始结果契约验证命令
          set -euo pipefail # 任一契约不满足立即停止
          python -c "import json; from pathlib import Path; root=Path('experiments/cross_passage_torsion_benchmark/results'); data=json.loads((root/'results.json').read_text(encoding='utf-8')); expected={'uniform_mesh','pure_pso','hotspot_pso','graph_multi_agent','dqn_gcn'}; assert {item['name'] for item in data['methods']}==expected; assert data['reference']['element_count']>data['mesh']['element_cap']; assert all(item['solution']['element_count']<=data['mesh']['element_cap'] for item in data['methods']); assert all(0.0<=item['energy_error']<=1.0 for item in data['methods']); assert (root/'RESULTS.md').is_file(); assert (root/'method_summary.csv').is_file(); assert (root/'method_objective.png').is_file(); assert (root/'convergence.png').is_file()" # 验证全部结果契约
      - name: Upload complete evidence # 无论成功失败均上传输入、输出、轨迹和日志
        if: always() # 确保失败时仍保留诊断证据
        uses: actions/upload-artifact@v4 # 使用官方制品上传动作
        with: # 配置上传范围
          name: cross-passage-torsion-five-method-evidence # 定义制品名称
          path: | # 列出需要保留的证据路径
            experiments/cross_passage_torsion_benchmark/results/ # 上传参考解、候选求解、表格、图和结论
            /tmp/cross-passage-torsion.log # 上传完整实验日志
            /tmp/apt-install.log # 上传 CalculiX 安装日志
          if-no-files-found: warn # 早期失败无文件时保留原始错误
          retention-days: 14 # 保留完整证据十四天
      - name: Commit reproducible results # 将成功实验结果提交回当前实验分支
        if: success() # 仅在完整求解和契约验证通过后提交
        shell: bash # 使用 Bash 执行 Git 操作
        run: | # 开始结果提交命令
          set -euo pipefail # 任一提交或推送错误立即停止
          git config user.name 'github-actions[bot]' # 配置自动提交者名称
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' # 配置自动提交者邮箱
          git add experiments/cross_passage_torsion_benchmark/results # 暂存全部可复现实验结果和求解收据
          if git diff --cached --quiet; then exit 0; fi # 结果未变化时跳过空提交
          git commit -m 'results: rerun cross-passage torsion five-method benchmark' # 创建明确的实验结果提交
          git push origin HEAD:${{ github.ref_name }} # 将结果推送回人工启动工作流的当前分支
