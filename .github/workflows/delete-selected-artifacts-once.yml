name: Delete selected artifacts once # 定义一次性清理工作流名称
on: # 定义工作流触发条件
  push: # 在推送提交时触发工作流
    paths: # 仅当本文件发生变化时触发
      - '.github/workflows/delete-selected-artifacts-once.yml' # 限制触发路径为本工作流文件
permissions: # 设置工作流令牌权限
  actions: write # 允许删除 GitHub Actions artifacts
  contents: read # 仅允许读取仓库内容
jobs: # 定义工作流任务
  delete-selected-artifacts: # 定义删除指定 artifacts 的任务
    runs-on: ubuntu-latest # 使用 GitHub 托管的 Ubuntu runner
    steps: # 定义任务执行步骤
      - name: Delete the four oversized artifacts # 描述删除四个超大 artifacts 的步骤
        env: # 定义步骤所需环境变量
          GH_TOKEN: ${{ github.token }} # 使用本次工作流自动生成的 GitHub 令牌
          GH_REPO: ${{ github.repository }} # 使用当前仓库的 owner/name
        shell: bash # 使用 Bash 执行删除命令
        run: | # 开始执行多行 Bash 脚本
          set -euo pipefail # 遇到错误、未定义变量或管道失败时立即停止
          artifact_ids=(8821220790 8821095974 8821087218 8821005213) # 保存需要删除的四个 artifact ID
          for artifact_id in "${artifact_ids[@]}"; do # 逐个处理需要删除的 artifact
            echo "Deleting artifact ${artifact_id}" # 在日志中显示当前删除目标
            gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/${artifact_id}" # 调用 GitHub API 删除当前 artifact
          done # 结束 artifact 循环
          echo "Selected artifacts deleted" # 在日志中确认清理脚本执行结束
