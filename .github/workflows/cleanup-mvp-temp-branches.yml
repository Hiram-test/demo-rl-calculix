name: Cleanup MVP temporary branches

on:
  pull_request:
    paths:
      - ".github/workflows/cleanup-mvp-temp-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete temporary troubleshooting branches
        shell: bash
        run: |
          git push origin --delete \
            noop-temp-check \
            feat/model-aware-fea-evidence-mvp-pr-trigger \
            feat/model-aware-fea-evidence-mvp-pr \
            feat/model-aware-fea-evidence-mvp-final \
            feat/model-aware-fea-evidence-mvp-ready \
            feat/model-aware-fea-evidence-mvp-review \
            feat/model-aware-fea-evidence-mvp-open-pr
