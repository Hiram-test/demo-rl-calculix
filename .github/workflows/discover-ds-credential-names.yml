name: Discover ds Credential Names

on:
  workflow_dispatch:
  push:
    branches:
      - feat/model-aware-fea-mvp
    paths:
      - ".github/workflows/discover-ds-credential-names.yml"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    environment: ds
    steps:
      - uses: actions/checkout@v4

      - name: List environment credential names without values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}/environments/ds"
          result = {"environment": "ds"}

          for kind in ("secrets", "variables"):
              request = urllib.request.Request(
                  f"{base}/{kind}?per_page=100",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2026-03-10",
                      "User-Agent": "ds-credential-name-discovery",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  result[f"{kind}_names"] = [
                      item.get("name", "") for item in payload.get(kind, [])
                  ]
                  result[f"{kind}_status"] = 200
              except urllib.error.HTTPError as exc:
                  result[f"{kind}_names"] = []
                  result[f"{kind}_status"] = exc.code

          with open(
              "examples/mesh_need/ds_credential_names.json", "w", encoding="utf-8"
          ) as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Publish names-only diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/mesh_need/ds_credential_names.json
          git commit -m "Record ds credential names only [skip ci]"
          git push origin HEAD:feat/model-aware-fea-mvp
