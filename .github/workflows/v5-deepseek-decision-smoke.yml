name: V5 live DeepSeek decision smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ai-dynamic-region-mesh-paper
    paths:
      - "src/engineering_agent/**"
      - "skills/engineering/**"
      - "scripts/v5_decide_once.py"
      - ".github/workflows/v5-deepseek-decision-smoke.yml"

jobs:
  live-decision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Build source-only manifest
        run: |
          mkdir -p run-input
          cat > run-input/problem_manifest.json <<'JSON'
          {
            "manifest_version": "1.0",
            "task_id": "v5-live-smoke",
            "user_goal": "Decide how to begin a regional finite-element mesh optimisation study from the currently available inputs without inventing physical model facts.",
            "input_files": [],
            "facts": {},
            "missing_facts": [],
            "algorithm_configuration": {},
            "observations": [
              "This smoke run intentionally contains no case geometry, material, load or boundary-condition values."
            ]
          }
          JSON
      - name: Run one new V5 DeepSeek decision
        run: |
          python scripts/v5_decide_once.py \
            --manifest run-input/problem_manifest.json \
            --skills skills/engineering \
            --trace-dir artifacts/v5-live-decision
      - name: Show decision
        if: always()
        run: |
          cat artifacts/v5-live-decision/agent_trace.json || true
      - name: Upload complete V5 decision trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-live-deepseek-decision-trace
          path: artifacts/v5-live-decision
          if-no-files-found: warn
