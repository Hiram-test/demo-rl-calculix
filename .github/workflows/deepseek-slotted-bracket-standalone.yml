name: DeepSeek Slotted-Bracket Live Skill Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/model-aware-fea-mvp
    paths:
      - ".github/workflows/deepseek-slotted-bracket-standalone.yml"
      - ".github/agent_payload/deepseek_slotted_payload_*.b64"

permissions:
  contents: read
  issues: write

env:
  PYTHONPATH: src

jobs:
  live-deepseek-agent-validation:
    runs-on: ubuntu-24.04
    environment: ds
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize self-contained agent package
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/deepseek-slotted-agent"
          mkdir -p "$RUNNER_TEMP/deepseek-slotted-agent"
          cat .github/agent_payload/deepseek_slotted_payload_*.b64 \
            | tr -d '\n' \
            | base64 --decode > "$RUNNER_TEMP/agent_payload.tar.gz"
          tar -xzf "$RUNNER_TEMP/agent_payload.tar.gz" \
            -C "$RUNNER_TEMP/deepseek-slotted-agent"
          cd "$RUNNER_TEMP/deepseek-slotted-agent"
          echo "Materialized package files:"
          find . -maxdepth 4 -type f | sort

      - name: Install runtime dependencies
        working-directory: ${{ runner.temp }}/deepseek-slotted-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "openai>=1.61,<3" \
            "jsonschema>=4.22,<5" \
            "numpy>=2,<3" \
            "scipy>=1.14,<2" \
            "shapely>=2,<3" \
            "matplotlib>=3.9,<4"

      - name: Run agent contract and Skill tests
        working-directory: ${{ runner.temp }}/deepseek-slotted-agent
        run: python -m unittest discover -s tests -p "test_agent_*.py" -v

      - name: Confirm DeepSeek credential
        env:
          DEEPSEEK_API_KEY: ${{ secrets.D || vars.D }}
        run: |
          test -n "$DEEPSEEK_API_KEY"
          echo "::add-mask::$DEEPSEEK_API_KEY"
          echo "DeepSeek credential is available from environment ds"

      - name: Run live DeepSeek-controlled Skill loop
        id: live_agent
        continue-on-error: true
        working-directory: ${{ runner.temp }}/deepseek-slotted-agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.D || vars.D }}
          DEEPSEEK_MODEL: deepseek-v4-pro
        run: |
          set -o pipefail
          echo "::add-mask::$DEEPSEEK_API_KEY"
          rm -rf artifacts/deepseek-slotted-live
          mkdir -p artifacts/deepseek-slotted-live
          python scripts/run_fea_agent.py \
            examples/agent/slotted_bracket_geometry_case.json \
            --manifest-dir skills/slotted_validation \
            --provider deepseek \
            --model deepseek-v4-pro \
            --output-dir artifacts/deepseek-slotted-live \
            --max-iterations 10 \
            --require-finished \
            | tee artifacts/deepseek-slotted-live/command_summary.json

      - name: Validate that decisions came from live DeepSeek
        id: validation
        if: always()
        continue-on-error: true
        working-directory: ${{ runner.temp }}/deepseek-slotted-agent
        run: |
          set -o pipefail
          if [ -f artifacts/deepseek-slotted-live/agent_trace.json ]; then
            python scripts/validate_live_deepseek_trace.py \
              artifacts/deepseek-slotted-live/agent_trace.json \
              | tee artifacts/deepseek-slotted-live/live_validation_receipt.json
          else
            mkdir -p artifacts/deepseek-slotted-live
            printf '%s\n' '{"valid":false,"errors":["agent_trace.json was not produced"]}' \
              | tee artifacts/deepseek-slotted-live/live_validation_receipt.json
            exit 1
          fi

      - name: Build full chronological report
        if: always()
        working-directory: ${{ runner.temp }}/deepseek-slotted-agent
        run: |
          set -euo pipefail
          if [ -f artifacts/deepseek-slotted-live/agent_trace.json ]; then
            python scripts/summarize_deepseek_validation.py \
              artifacts/deepseek-slotted-live \
              --output artifacts/deepseek-slotted-live/DEEPSEEK_VALIDATION_REPORT.md
            cat artifacts/deepseek-slotted-live/DEEPSEEK_VALIDATION_REPORT.md \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("artifacts/deepseek-slotted-live/github_actions_receipt.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "head_sha": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF"),
              "run_url": (
                  f"{os.environ.get('GITHUB_SERVER_URL')}/"
                  f"{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/"
                  f"{os.environ.get('GITHUB_RUN_ID')}"
              ),
              "environment": "ds",
              "provider": "deepseek",
              "requested_model": "deepseek-v4-pro",
          }
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish or update repository audit issue
        if: always()
        working-directory: ${{ runner.temp }}/deepseek-slotted-agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- deepseek-slotted-bracket-live-validation -->'
          title='DeepSeek slotted-bracket live validation'
          body_file="$RUNNER_TEMP/deepseek-validation-issue.md"
          {
            echo "$marker"
            echo "# DeepSeek slotted-bracket live validation"
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ -f artifacts/deepseek-slotted-live/github_actions_receipt.json ]; then
              echo '## Run receipt'
              echo '```json'
              cat artifacts/deepseek-slotted-live/github_actions_receipt.json
              echo '```'
            fi
            if [ -f artifacts/deepseek-slotted-live/live_validation_receipt.json ]; then
              echo '## Validation receipt'
              echo '```json'
              cat artifacts/deepseek-slotted-live/live_validation_receipt.json
              echo '```'
            fi
            if [ -f artifacts/deepseek-slotted-live/DEEPSEEK_VALIDATION_REPORT.md ]; then
              echo
              cat artifacts/deepseek-slotted-live/DEEPSEEK_VALIDATION_REPORT.md
            fi
          } > "$body_file"

          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --search "$title in:title" \
            --json number,title \
            --jq '.[] | select(.title == "DeepSeek slotted-bracket live validation") | .number' \
            | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file "$body_file"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file "$body_file"
          fi

      - name: Upload complete live-validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-slotted-bracket-live-validation
          path: ${{ runner.temp }}/deepseek-slotted-agent/artifacts/deepseek-slotted-live
          if-no-files-found: error
          retention-days: 90

      - name: Enforce final live-validation gate
        if: always()
        working-directory: ${{ runner.temp }}/deepseek-slotted-agent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/deepseek-slotted-live/live_validation_receipt.json")
          if not path.exists():
              raise SystemExit("live validation receipt is missing")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          if receipt.get("valid") is not True:
              raise SystemExit(
                  "live DeepSeek validation failed: "
                  + "; ".join(receipt.get("errors", ["unknown validation error"]))
              )
          print("Live DeepSeek validation passed")
          PY
