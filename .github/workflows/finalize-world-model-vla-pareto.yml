name: finalize-world-model-vla-pareto  # Name the one-shot Pareto-envelope correction workflow.

on:  # Define automatic and manual entry points.
  push:  # Run when this finalizer is added to the implementation branch.
    branches:  # Restrict execution to the dedicated WM-VLA branch.
      - "feat/world-model-vla-bridge-diaphragm-ready3"  # Select the sole writable branch.
    paths:  # Avoid retriggering after self-removal.
      - ".github/workflows/finalize-world-model-vla-pareto.yml"  # Trigger from this one-shot workflow.
      - "scripts/finalize_world_model_vla_pareto.py"  # Trigger from the paired Pareto finalizer.
  workflow_dispatch:  # Permit an explicit rerun if required.

permissions:  # Grant only the branch mutation required after verification.
  contents: write  # Permit the workflow token to commit the corrected gate and tests.

jobs:  # Define the isolated Pareto-gate finalization job.
  finalize:  # Apply, verify, and self-remove the comparison correction.
    runs-on: ubuntu-latest  # Use a reproducible Linux environment.
    timeout-minutes: 20  # Bound dependency installation and focused testing.
    steps:  # Execute checkout, correction, unit verification, cleanup, and commit.
      - name: Check out implementation branch  # Materialize the writable branch.
        uses: actions/checkout@v4  # Use the maintained checkout action.
        with:  # Configure exact branch checkout.
          ref: "feat/world-model-vla-bridge-diaphragm-ready3"  # Select the dedicated implementation branch.
          fetch-depth: 0  # Retain branch history for a normal commit.
      - name: Set up Python  # Select the supported interpreter.
        uses: actions/setup-python@v5  # Use the maintained Python setup action.
        with:  # Configure the interpreter version.
          python-version: "3.11"  # Match permanent verification.
      - name: Apply Pareto-envelope correction  # Replace raw-point comparison with retained-solution envelopes.
        run: |  # Execute the deterministic source finalizer.
          python scripts/finalize_world_model_vla_pareto.py  # Apply the comparison and regression-test changes.
      - name: Install repository  # Install Python dependencies and Pytest.
        run: |  # Execute deterministic Python installation commands.
          python -m pip install --upgrade pip  # Upgrade the package installer.
          python -m pip install -e . pytest  # Install the editable repository and test runner.
      - name: Verify corrected scientific gate  # Reject syntax, purity, planning, and Pareto-envelope regressions.
        run: |  # Execute the complete focused unit suite.
          python -m py_compile scripts/run_world_model_vla_bridge.py  # Compile the corrected campaign runner.
          python -m py_compile tests/test_world_controller.py  # Compile the expanded unit suite.
          python -m pytest -q tests/test_world_controller.py  # Run controller and comparison regression gates.
      - name: Remove one-shot files  # Keep the final pull request free of maintenance machinery.
        run: |  # Delete only the paired temporary files.
          rm scripts/finalize_world_model_vla_pareto.py  # Remove the temporary source finalizer.
          rm .github/workflows/finalize-world-model-vla-pareto.yml  # Remove this one-shot workflow definition.
      - name: Commit corrected Pareto gate  # Persist only production comparison logic and tests.
        run: |  # Create and push one auditable branch update.
          git config user.name "github-actions[bot]"  # Set the standard automation author name.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"  # Set the standard automation author email.
          git add -A  # Stage corrected source, tests, and temporary-file removals.
          git diff --cached --quiet || git commit -m "fix: compare WM-VLA and Dörfler Pareto envelopes"  # Commit only a material change.
          git pull --rebase origin feat/world-model-vla-bridge-diaphragm-ready3  # Reconcile any preceding solver-evidence commit.
          git push origin HEAD:feat/world-model-vla-bridge-diaphragm-ready3  # Update the sole implementation branch.
