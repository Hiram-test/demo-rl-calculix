name: cleanup-world-model-vla-branches  # Name the one-shot intermediate-branch cleanup workflow.

on:  # Define automatic and manual entry points.
  push:  # Run when this cleanup workflow is added to the final implementation branch.
    branches:  # Restrict execution to the sole final branch.
      - "feat/world-model-vla-bridge-diaphragm-ready3"  # Select the retained implementation branch.
    paths:  # Avoid retriggering after self-removal.
      - ".github/workflows/cleanup-world-model-vla-branches.yml"  # Trigger only from this one-shot workflow definition.
  workflow_dispatch:  # Permit an explicit rerun if the push event is delayed.

permissions:  # Grant only the repository mutation required for branch deletion and self-removal.
  contents: write  # Permit the workflow token to delete obsolete refs and update the retained branch.

jobs:  # Define the isolated cleanup job.
  cleanup:  # Delete only the known redundant WM-VLA branches.
    runs-on: ubuntu-latest  # Use a reproducible Linux environment.
    timeout-minutes: 10  # Bound all Git operations.
    steps:  # Execute checkout, guarded branch deletion, self-removal, and commit.
      - name: Check out retained implementation branch  # Materialize the branch that must remain.
        uses: actions/checkout@v4  # Use the maintained checkout action.
        with:  # Configure exact branch checkout.
          ref: "feat/world-model-vla-bridge-diaphragm-ready3"  # Select the retained final branch.
          fetch-depth: 0  # Retain refs for guarded deletion.
      - name: Delete redundant intermediate branches  # Remove only branches created during the same WM-VLA implementation sequence.
        run: |  # Execute guarded remote-ref deletions.
          for branch in feat/world-model-vla-bridge-diaphragm-ci feat/world-model-vla-bridge-diaphragm-final feat/world-model-vla-bridge-diaphragm-release feat/world-model-vla-bridge-diaphragm-work feat/world-model-vla-bridge-diaphragm-impl feat/world-model-vla-bridge-diaphragm-complete feat/world-model-vla-bridge-diaphragm-done feat/world-model-vla-bridge-diaphragm-finalized feat/world-model-vla-bridge-diaphragm-ready feat/world-model-vla-bridge-diaphragm-ready2; do  # Enumerate the exact obsolete branch names.
            git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1 && git push origin --delete "$branch" || true  # Delete an existing obsolete ref and ignore only an already absent ref.
          done  # Finish the exact obsolete-branch set.
      - name: Remove one-shot cleanup workflow  # Keep the retained branch free of maintenance machinery.
        run: |  # Delete only this workflow file.
          rm .github/workflows/cleanup-world-model-vla-branches.yml  # Remove the completed one-shot cleanup definition.
      - name: Commit cleanup self-removal  # Persist the final clean branch tree.
        run: |  # Create and push one auditable cleanup commit.
          git config user.name "github-actions[bot]"  # Set the standard automation author name.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"  # Set the standard automation author email.
          git add -A  # Stage only the workflow self-removal.
          git diff --cached --quiet || git commit -m "chore: remove one-shot branch cleanup workflow"  # Commit only a material cleanup change.
          git pull --rebase origin feat/world-model-vla-bridge-diaphragm-ready3  # Reconcile any concurrent evidence commit.
          git push origin HEAD:feat/world-model-vla-bridge-diaphragm-ready3  # Update the retained final branch.
