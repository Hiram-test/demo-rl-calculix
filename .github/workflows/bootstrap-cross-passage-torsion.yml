name: Remove torsion bootstrap files # 定义一次性仓库清理工作流名称
on: # 定义工作流触发条件
  pull_request: # 使用当前实验 PR 的同步事件执行清理
    branches: # 限定目标分支
      - main # 仅面向主分支的实验 PR 运行
    paths: # 限定触发文件
      - .github/workflows/bootstrap-cross-passage-torsion.yml # 仅当前一次性清理工作流变化时触发
permissions: # 定义最小必要权限
  contents: write # 允许删除临时文件并提交清理结果
jobs: # 定义作业集合
  cleanup: # 定义唯一清理作业
    runs-on: ubuntu-24.04 # 使用固定 Ubuntu 24.04 虚拟机
    steps: # 定义顺序执行步骤
      - uses: actions/checkout@v4 # 检出 PR 源分支
        with: # 配置检出行为
          ref: ${{ github.event.pull_request.head.ref }} # 明确检出需要清理的实验分支
          fetch-depth: 0 # 获取完整历史以便提交删除
      - name: Remove one-time bootstrap artifacts # 删除载荷分块、补丁、缓存和本工作流
        shell: bash # 使用 Bash 执行清理
        run: | # 开始清理命令
          set -euo pipefail # 任一删除或提交错误立即停止
          git config user.name 'github-actions[bot]' # 配置自动提交者名称
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' # 配置自动提交者邮箱
          git rm -f .github/workflows/bootstrap-cross-passage-torsion.yml # 删除完成使命的一次性清理工作流
          git rm -f bootstrap_cross_passage_torsion_payload.b64 # 删除早期截断的单文件载荷
          git rm -f bootstrap_cross_passage_torsion_payload.part00 # 删除载荷分块零
          git rm -f bootstrap_cross_passage_torsion_payload.part01 # 删除载荷分块一
          git rm -f bootstrap_cross_passage_torsion_payload.part02 # 删除载荷分块二
          git rm -f bootstrap_cross_passage_torsion_payload.part03 # 删除载荷分块三
          git rm -f bootstrap_cross_passage_torsion_payload.part04 # 删除载荷分块四
          git rm -f bootstrap_cross_passage_torsion_payload.part05 # 删除载荷分块五
          git rm -f bootstrap_cross_passage_torsion_payload.part06 # 删除载荷分块六
          git rm -f patch_cross_passage_torsion_runner.py # 删除已固化进正式主程序的位移兼容补丁
          git rm -f patch_cross_passage_torsion_metrics.py # 删除已固化进正式主程序的独立指标补丁
          git rm -f experiments/cross_passage_torsion_benchmark/__pycache__/run_benchmark.cpython-311.pyc # 删除 Python 编译缓存
          git commit -m 'chore: remove torsion benchmark bootstrap artifacts' # 创建一次性清理提交
          git push origin HEAD:${{ github.event.pull_request.head.ref }} # 推送清理后的正式实验分支
