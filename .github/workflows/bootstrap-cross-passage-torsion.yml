name: Remove torsion bootstrap files # 定义一次性仓库清理工作流名称
on: # 定义工作流触发条件
  pull_request: # 使用当前实验 PR 的同步事件执行清理
    branches: # 限定目标分支
      - main # 仅面向主分支的实验 PR 运行
    paths: # 限定触发文件
      - .github/workflows/bootstrap-cross-passage-torsion.yml # 仅当前一次性清理工作流变化时触发
permissions: # 定义最小必要权限
  contents: write # 允许删除临时文件并提交清理结果
jobs: # 定义作业集合
  cleanup: # 定义唯一清理作业
    runs-on: ubuntu-24.04 # 使用固定 Ubuntu 24.04 虚拟机
    steps: # 定义顺序执行步骤
      - uses: actions/checkout@v4 # 检出 PR 源分支
        with: # 配置检出行为
          ref: ${{ github.event.pull_request.head.ref }} # 明确检出需要清理的实验分支
          fetch-depth: 0 # 获取完整历史以便提交删除
      - name: Remove one-time bootstrap artifacts # 删除载荷分块、补丁、缓存和本工作流
        shell: bash # 使用 Bash 执行清理
        run: | # 开始清理命令
          set -euo pipefail # 任一提交或推送错误立即停止
          git config user.name 'github-actions[bot]' # 配置自动提交者名称
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' # 配置自动提交者邮箱
          git rm -f --ignore-unmatch .github/workflows/bootstrap-cross-passage-torsion.yml bootstrap_cross_passage_torsion_payload.b64 bootstrap_cross_passage_torsion_payload.part00 bootstrap_cross_passage_torsion_payload.part01 bootstrap_cross_passage_torsion_payload.part02 bootstrap_cross_passage_torsion_payload.part03 bootstrap_cross_passage_torsion_payload.part04 bootstrap_cross_passage_torsion_payload.part05 bootstrap_cross_passage_torsion_payload.part06 patch_cross_passage_torsion_runner.py patch_cross_passage_torsion_metrics.py experiments/cross_passage_torsion_benchmark/__pycache__/run_benchmark.cpython-311.pyc # 原子删除所有仍存在的一次性文件并忽略已缺失路径
          git commit -m 'chore: remove torsion benchmark bootstrap artifacts' # 创建一次性清理提交
          git push origin HEAD:${{ github.event.pull_request.head.ref }} # 推送清理后的正式实验分支
