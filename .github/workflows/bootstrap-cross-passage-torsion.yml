name: Cross-passage torsion five-method experiment # 定义完整扭转实验工作流名称
on: # 定义工作流触发条件
  pull_request: # 使用同仓库草稿 PR 事件运行并暴露可读作业状态
    branches: # 限定目标分支
      - main # 仅面向主分支的实验 PR 运行
    paths: # 限定当前实验载荷和工作流变化
      - bootstrap_cross_passage_torsion_payload.b64 # 监听压缩实验载荷
      - .github/workflows/bootstrap-cross-passage-torsion.yml # 监听当前工作流
permissions: # 定义最小必要权限
  contents: write # 允许将完整实现和真实结果提交到 PR 源分支
jobs: # 定义作业集合
  benchmark: # 定义唯一五方法实验作业
    runs-on: ubuntu-24.04 # 使用固定 Ubuntu 24.04 虚拟机
    timeout-minutes: 90 # 设置真实 CalculiX 全实验上限
    env: # 定义确定性数值环境
      MPLBACKEND: Agg # 强制使用无头绘图后端
      OMP_NUM_THREADS: '1' # 固定 OpenMP 线程数
      MKL_NUM_THREADS: '1' # 固定 MKL 线程数
    steps: # 定义顺序执行步骤
      - uses: actions/checkout@v4 # 检出 PR 源分支而非临时合并提交
        with: # 配置检出参数
          ref: ${{ github.event.pull_request.head.ref }} # 明确检出实验源分支
          fetch-depth: 0 # 获取完整历史以便提交结果
      - uses: actions/setup-python@v5 # 安装固定 Python 环境
        with: # 配置解释器版本
          python-version: '3.11' # 使用 Python 3.11
      - name: Expand and compile experiment # 解包并编译检查完整实验实现
        shell: bash # 使用 Bash 调用内嵌 Python
        run: | # 开始解包命令
          set -euo pipefail # 任一错误立即停止
          python - <<'PY' # 启动受控 Python 解包器
          import base64 # 导入 Base64 解码模块
          import tarfile # 导入压缩归档模块
          from pathlib import Path # 导入路径模块
          source = Path('bootstrap_cross_passage_torsion_payload.b64') # 定义压缩载荷文件
          target = Path('/tmp/cross_passage_torsion_payload.tar.gz') # 定义临时归档路径
          target.write_bytes(base64.b64decode(source.read_text(encoding='utf-8'))) # 解码真实归档字节
          with tarfile.open(target, mode='r:gz') as archive: # 打开归档
              for member in archive.getmembers(): # 遍历归档成员
                  if member.name.startswith('experiments/cross_passage_torsion_benchmark/'): # 仅选择实验目录
                      archive.extract(member, path='.') # 展开受控实验成员
          PY # 结束解包器
          python -m py_compile experiments/cross_passage_torsion_benchmark/run_benchmark.py # 编译检查实现
      - name: Install real solver dependencies # 安装真实 CalculiX 与数值依赖
        shell: bash # 使用 Bash 执行安装
        run: | # 开始依赖安装
          set -euo pipefail # 任一安装错误立即停止
          python -m pip install --upgrade pip --quiet # 更新 pip
          python -m pip install numpy matplotlib --quiet # 安装数组和绘图依赖
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu --quiet # 安装 CPU 版 PyTorch
          sudo apt-get update -qq # 更新 Ubuntu 软件包索引
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq calculix-ccx # 安装真实 CalculiX 求解器
      - name: Run complete comparison # 执行参考解和五种方法全部真实候选求解
        shell: bash # 使用 Bash 执行实验
        run: | # 开始求解命令
          set -euo pipefail # 任一求解或解析错误立即停止
          CCX_BIN="$(command -v ccx || true)" # 优先定位标准 ccx 命令
          if [[ -z "$CCX_BIN" ]]; then CCX_BIN="$(find /usr/bin -maxdepth 1 -type f -name 'ccx*' | sort | head -n 1)"; fi # 回退定位版本化求解器
          test -x "$CCX_BIN" # 验证求解器可执行
          rm -rf experiments/cross_passage_torsion_benchmark/results # 清除历史结果
          python experiments/cross_passage_torsion_benchmark/run_benchmark.py --ccx "$CCX_BIN" --output experiments/cross_passage_torsion_benchmark/results # 执行完整五方法实验
      - name: Validate and commit measured results # 验证结果契约并提交实现与结果
        shell: bash # 使用 Bash 调用验证器和 Git
        run: | # 开始验证提交脚本
          set -euo pipefail # 任一契约或提交错误立即停止
          python - <<'PY' # 启动内嵌结果验证器
          import json # 导入 JSON 模块
          from pathlib import Path # 导入路径模块
          root = Path('experiments/cross_passage_torsion_benchmark/results') # 定义结果根目录
          data = json.loads((root / 'results.json').read_text(encoding='utf-8')) # 读取机器可读结果
          expected = {'uniform_mesh', 'pure_pso', 'hotspot_pso', 'graph_multi_agent', 'dqn_gcn'} # 定义五种要求方法
          assert {item['name'] for item in data['methods']} == expected # 验证五种方法完整
          assert data['reference']['element_count'] > data['mesh']['element_cap'] # 验证参考网格更细
          assert all(item['solution']['element_count'] <= data['mesh']['element_cap'] for item in data['methods']) # 验证统一资源上限
          assert (root / 'RESULTS.md').is_file() # 验证中文结论存在
          assert (root / 'method_summary.csv').is_file() # 验证汇总数据存在
          PY # 结束结果验证器
          git config user.name 'github-actions[bot]' # 配置自动提交者名称
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' # 配置自动提交者邮箱
          git add experiments/cross_passage_torsion_benchmark # 暂存实现和全部求解证据
          git commit -m 'experiment: run cross-passage torsion five-method benchmark' # 创建测量结果提交
          git push origin HEAD:${{ github.event.pull_request.head.ref }} # 推送到 PR 源分支
