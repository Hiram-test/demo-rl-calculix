name: Extract original V4 source for backend repair  # Materialize the retained agent implementation without running DeepSeek.
on:  # Trigger only while the temporary extraction workflow exists on the repair PR.
  pull_request:  # Run after this file is added to the isolated repair branch.
    branches:  # Restrict the target branch.
      - feat/ai-dynamic-region-mesh-paper  # Keep extraction isolated from main.
permissions:  # Grant repository read access only.
  contents: read  # Allow checkout of the retained source chunks.
jobs:  # Decode and publish the original agent source tree.
  extract:  # Run one deterministic extraction job.
    runs-on: ubuntu-24.04  # Use a clean hosted runner.
    steps:  # Check out, verify, unpack, and upload the source.
      - uses: actions/checkout@v4  # Check out the repair branch with inherited V4 payload chunks.
      - name: Decode hash-verified retained V4 source  # Reproduce the original materialization step exactly.
        run: |  # Fail on missing chunks, hash drift, or archive errors.
          set -euo pipefail  # Stop on every extraction error.
          archive="$RUNNER_TEMP/bridge-agent-v4-source.tar.xz"  # Allocate the reconstructed archive.
          root="$RUNNER_TEMP/bridge-agent-v4"  # Allocate the extracted source tree.
          rm -rf "$archive" "$root"  # Prevent reuse from any previous step.
          mkdir -p "$root"  # Create a clean extraction root.
          cat .github/agent_v4_payload/source_*.b64 | tr -d '[:space:]' | base64 --decode > "$archive"  # Reconstruct the retained binary archive.
          echo '9d23b4d488986f8136babc0d9be00c37aa9a06b6c4ffab0efcfa5338344e3215  '"$archive" | sha256sum -c -  # Require the original source digest.
          tar -xJf "$archive" -C "$root"  # Extract the complete agent source.
          test -s "$root/scripts/run_one_case.py"  # Require the original single-case controller.
          test -s "$root/bridge_agent/region_skills.py"  # Require the original regional-mesh Skill implementation.
          test -s "$root/bridge_agent/runtime.py"  # Require the original agent runtime.
      - uses: actions/upload-artifact@v4  # Publish source for local inspection only.
        with:  # Configure the temporary artifact.
          name: original-v4-source-for-backend-repair  # Use a unique temporary name.
          path: ${{ runner.temp }}/bridge-agent-v4  # Upload the complete extracted source tree.
          if-no-files-found: error  # Refuse a green job without source.
          retention-days: 7  # Keep temporary source evidence briefly.