name: Query episodic benchmark run # 定义只读查询实验运行状态的一次性工作流
on: # 定义触发条件
  push: # 使用受控文件推送触发
    branches: # 限定诊断分支
      - ops/query-episodic-run-20260806 # 仅在临时诊断分支运行
    paths: # 限定触发文件
      - .ops/query-episodic-run.trigger # 仅由一次性状态查询标记触发
permissions: # 定义最小必要权限
  actions: read # 允许读取当前仓库 Actions 运行状态
  issues: write # 允许将状态摘要写入 PR 对话
  contents: read # 允许检出诊断分支
jobs: # 定义诊断作业
  query: # 查询当前实验分支的工作流运行
    runs-on: ubuntu-24.04 # 使用标准 GitHub 托管运行器
    steps: # 定义顺序步骤
      - uses: actions/checkout@v4 # 检出临时诊断分支
      - name: Query and report runs # 查询实验分支最近运行并回写 PR 评论
        shell: bash # 使用 Bash 执行 API 查询与文本整理
        env: # 定义 GitHub CLI 身份
          GH_TOKEN: ${{ github.token }} # 使用当前工作流最小权限令牌
        run: | # 开始查询与回写命令
          set -euo pipefail # 任一 API 或格式化错误立即停止
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=exp%2Fcross-passage-torsion-five-methods&per_page=10" > /tmp/runs.json # 获取实验分支最近十次 Actions 运行
          python - <<'PY' # 将 JSON 转换为紧凑 Markdown 状态摘要
          import json  # 解析 GitHub Actions API 响应
          from pathlib import Path  # 读取响应并写出评论正文
          data = json.loads(Path('/tmp/runs.json').read_text(encoding='utf-8'))  # 读取运行列表
          rows = []  # 初始化运行摘要行
          for run in data.get('workflow_runs', [])[:10]:  # 遍历最近十次工作流运行
              rows.append(f"- `{run['id']}` | {run['name']} | event={run['event']} | status={run['status']} | conclusion={run.get('conclusion')} | head=`{run['head_sha'][:10]}` | updated={run['updated_at']} | {run['html_url']}")  # 写入运行编号、状态、提交和链接
          body = "## Episodic DQN Actions status\n\n" + ("\n".join(rows) if rows else "No workflow runs found for the experiment branch.")  # 构造完整评论正文
          Path('/tmp/status.md').write_text(body + '\n', encoding='utf-8')  # 保存评论正文
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/24/comments" -f body="$(cat /tmp/status.md)" # 将只读状态摘要发布到 PR 二十四
