name: guarded world model VLA bridge gate # Identify the dedicated protected scientific release workflow.
on: # Define automatic validation triggers.
  push: # Validate every update to the implementation branch.
    branches: # Restrict branch pushes to the active feature line.
      - feat/world-model-vla-bridge-3d # Run while the branch is being developed.
    paths: # Ignore unrelated repository edits.
      - visionamr/vla/world_state.py # Watch world-state changes.
      - visionamr/vla/world_model.py # Watch transition-model changes.
      - visionamr/vla/tool_gateway.py # Watch deterministic base tool changes.
      - visionamr/vla/planner.py # Watch base planning records.
      - visionamr/vla/world_pipeline.py # Watch shared loop helpers.
      - visionamr/vla/guarded_gateway.py # Watch protected numerical execution.
      - visionamr/vla/guarded_planner.py # Watch protected world planning.
      - visionamr/vla/guarded_pipeline.py # Watch the deployable real loop.
      - scripts/run_world_vla_bridge.py # Watch the diagnostic v1 experiment.
      - scripts/run_guarded_world_vla_bridge.py # Watch the strict v2 experiment.
      - tests/test_world_model_vla.py # Watch base world-model unit tests.
      - tests/test_guarded_world_vla.py # Watch protected-controller unit tests.
      - .github/workflows/world-model-vla-3d.yml # Watch this workflow.
  pull_request: # Validate the stacked pull request.
    paths: # Run only when the implementation or its gates change.
      - visionamr/vla/world_state.py # Watch world-state changes.
      - visionamr/vla/world_model.py # Watch transition-model changes.
      - visionamr/vla/tool_gateway.py # Watch deterministic base tool changes.
      - visionamr/vla/planner.py # Watch base planning records.
      - visionamr/vla/world_pipeline.py # Watch shared loop helpers.
      - visionamr/vla/guarded_gateway.py # Watch protected numerical execution.
      - visionamr/vla/guarded_planner.py # Watch protected world planning.
      - visionamr/vla/guarded_pipeline.py # Watch the deployable real loop.
      - scripts/run_world_vla_bridge.py # Watch the diagnostic v1 experiment.
      - scripts/run_guarded_world_vla_bridge.py # Watch the strict v2 experiment.
      - tests/test_world_model_vla.py # Watch base world-model unit tests.
      - tests/test_guarded_world_vla.py # Watch protected-controller unit tests.
      - .github/workflows/world-model-vla-3d.yml # Watch this workflow.
permissions: # Grant only the read access needed by CI.
  contents: read # Check out repository evidence without mutation.
jobs: # Define independent validation stages.
  focused-unit-tests: # Validate contracts and model logic before native solves.
    runs-on: ubuntu-24.04 # Use the same current Ubuntu generation as the main repository workflow.
    steps: # Execute deterministic unit validation.
      - uses: actions/checkout@v4 # Check out the exact triggering commit.
      - uses: actions/setup-python@v5 # Install a reproducible Python runtime.
        with: # Configure Python setup.
          python-version: '3.12' # Match the main repository workflow.
          cache: pip # Reuse dependency downloads.
      - name: Install focused Python dependencies # Install only packages imported by the unit path.
        run: python -m pip install --upgrade pip --quiet && python -m pip install numpy scipy pytest --quiet # Keep installation compact and deterministic.
      - name: Run world-model VLA unit tests # Exercise state, model, tools, protected planning, and method isolation.
        run: python -m pytest tests/test_world_model_vla.py tests/test_guarded_world_vla.py -q # Fail on any contract regression.
  bridge-3d-release-gate: # Compare real three-dimensional solutions with faithful standalone Dörfler.
    needs: focused-unit-tests # Avoid native work when core contracts already fail.
    runs-on: ubuntu-24.04 # Use the supported native environment.
    steps: # Install native tools and execute the strict comparison.
      - uses: actions/checkout@v4 # Check out the exact triggering commit.
      - uses: actions/setup-python@v5 # Install Python for orchestration.
        with: # Configure Python setup.
          python-version: '3.12' # Match unit and repository workflows.
          cache: pip # Reuse dependency downloads.
      - name: Install Gmsh CalculiX and Python dependencies # Prepare the real FEA stack.
        run: python -m pip install --upgrade pip --quiet && python -m pip install gmsh numpy scipy matplotlib pytest --quiet && sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq calculix-ccx libglu1-mesa libxcursor1 libxft2 libxinerama1 # Install all runtime dependencies.
      - name: Run strict guarded medium-complexity bridge gate # Execute matched-solve bearing-hole and deck-opening comparisons.
        run: python scripts/run_guarded_world_vla_bridge.py --cases bearing_hole,deck_opening --max-solves 6 --strict --out /tmp/guarded_world_model_vla_bridge # Require Dörfler noninferiority and accepted protected world actions.
      - name: Upload complete guarded world-model evidence # Preserve records even when the strict scientific gate fails.
        if: always() # Run after success or failure.
        uses: actions/upload-artifact@v4 # Publish traces, tool certificates, and solver records.
        with: # Configure artifact upload.
          name: guarded-world-model-vla-bridge-3d # Use a stable evidence name.
          path: /tmp/guarded_world_model_vla_bridge # Upload both cases and suite summary.
          if-no-files-found: error # Detect missing evidence rather than silently succeeding.
