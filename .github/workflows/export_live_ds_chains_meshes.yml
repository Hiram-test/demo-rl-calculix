name: Export live DeepSeek chains and meshes

on:
  push:
    branches:
      - export/live-ds-chains-meshes-30707886295
    paths:
      - .github/workflows/export_live_ds_chains_meshes.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compact export dependencies
        run: python -m pip install numpy matplotlib
      - name: Download four original artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/raw"
          gh run download 30707886295 --repo "$GITHUB_REPOSITORY" --name original-v4-live-deepseek-bearing_load_introduction --dir "$RUNNER_TEMP/raw/bearing_load_introduction"
          gh run download 30707886295 --repo "$GITHUB_REPOSITORY" --name original-v4-live-deepseek-web_circular_opening --dir "$RUNNER_TEMP/raw/web_circular_opening"
          gh run download 30707886295 --repo "$GITHUB_REPOSITORY" --name original-v4-live-deepseek-diaphragm_multi_opening_budget --dir "$RUNNER_TEMP/raw/diaphragm_multi_opening_budget"
          gh run download 30707886295 --repo "$GITHUB_REPOSITORY" --name original-v4-live-deepseek-bridge_web_crack --dir "$RUNNER_TEMP/raw/bridge_web_crack"
      - name: Build TXT and PNG files
        run: |
          cat > "$RUNNER_TEMP/export.py" <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import matplotlib.pyplot as plt
          import matplotlib.tri as mtri

          raw = Path("$RUNNER_TEMP/raw")
          out = Path("$RUNNER_TEMP/compact")
          out.mkdir(parents=True, exist_ok=True)
          labels = {
              "bearing_load_introduction": "01_支座",
              "web_circular_opening": "02_单圆孔",
              "diaphragm_multi_opening_budget": "03_三孔",
              "bridge_web_crack": "04_裂纹",
          }

          def find_one(root, name):
              hits = list(root.rglob(name))
              if not hits:
                  raise FileNotFoundError(f"{root}: {name}")
              return hits[0]

          def load_mesh(path):
              data = np.load(path)
              nodes = np.asarray(data["nodes"])
              elements = np.asarray(data["elements"])
              if elements.ndim != 2 or elements.shape[1] < 3:
                  raise ValueError(path)
              elements = elements[:, :3].astype(int)
              if elements.min() >= 1 and elements.max() == len(nodes):
                  elements -= 1
              return nodes, elements

          def mesh_candidates(root, best_elements):
              rows=[]
              for path in root.rglob("*.npz"):
                  try:
                      nodes,elements=load_mesh(path)
                  except Exception:
                      continue
                  rows.append((path,nodes,elements,len(elements)))
              optimized=[r for r in rows if "uniform" not in r[0].name.lower() and "reference" not in r[0].name.lower()]
              uniform=[r for r in rows if "uniform" in r[0].name.lower()]
              if not optimized:
                  raise RuntimeError(f"no optimized mesh in {root}")
              opt=min(optimized,key=lambda r:(abs(r[3]-best_elements),0 if "pso" in r[0].name.lower() else 1))
              uni=min(uniform,key=lambda r:abs(r[3]-opt[3])) if uniform else None
              return opt,uni

          def plot_mesh(nodes,elements,path,title,xlim=None,ylim=None):
              tri=mtri.Triangulation(nodes[:,0],nodes[:,1],elements)
              fig,ax=plt.subplots(figsize=(12,5))
              ax.triplot(tri,linewidth=0.28)
              ax.set_aspect("equal",adjustable="box")
              ax.set_xlabel("x / mm")
              ax.set_ylabel("y / mm")
              ax.set_title(title)
              if xlim: ax.set_xlim(*xlim)
              if ylim: ax.set_ylim(*ylim)
              fig.tight_layout()
              fig.savefig(path,dpi=240,bbox_inches="tight")
              plt.close(fig)

          for case_id,label in labels.items():
              root=raw/case_id
              trace_path=find_one(root,"agent_trace.json")
              trace=json.loads(trace_path.read_text(encoding="utf-8"))
              case_out=out/label
              case_out.mkdir(parents=True,exist_ok=True)

              raw_lines=[f"{case_id} live DeepSeek 原始逐轮回复","来源：GitHub Actions Run 30707886295","未翻译、未改写、未省略。",""]
              responses=sorted(root.rglob("iteration_*_response.json"))
              for i,path in enumerate(responses,1):
                  obj=json.loads(path.read_text(encoding="utf-8"))
                  raw_lines += ["="*90,f"第 {i} 轮","="*90,str(obj.get("raw_text","")),""]
              (case_out/f"{label}_DeepSeek原始回复.txt").write_text("\n".join(raw_lines),encoding="utf-8")

              chain=[f"{case_id} live DeepSeek 完整决策链",f"status={trace.get('status')}",json.dumps(trace.get("counters",{}),ensure_ascii=False),""]
              best_elements=0
              for event in trace.get("events",[]):
                  if event.get("type")=="model_decision":
                      d=event.get("decision",{})
                      chain += ["="*90,f"第 {event.get('iteration')} 轮 DeepSeek 决策",f"工程摘要：{event.get('engineer_facing_summary','')}",f"当前判断：{event.get('current_judgment','')}",f"主要不确定性：{event.get('main_uncertainty','')}","决策：",json.dumps(d,ensure_ascii=False,indent=2),""]
                  elif event.get("type")=="skill_call":
                      req=event.get("request",{}); res=event.get("result",{})
                      chain += [f"Skill返回：{req.get('skill','')}",f"状态：{res.get('status','')}",f"摘要：{res.get('summary','')}","data：",json.dumps(res.get("data",{}),ensure_ascii=False,indent=2),""]
                      if req.get("skill")=="optimize_region_size_field_pso":
                          best_elements=int(res.get("data",{}).get("best_elements",0) or 0)
              (case_out/f"{label}_完整决策链.txt").write_text("\n".join(chain),encoding="utf-8")
              (case_out/f"{label}_agent_trace.json").write_text(json.dumps(trace,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

              opt,uni=mesh_candidates(root,best_elements)
              plot_mesh(opt[1],opt[2],case_out/f"{label}_最终优化网格.png",f"{case_id}: optimized mesh ({opt[3]} elements)")
              if uni:
                  plot_mesh(uni[1],uni[2],case_out/f"{label}_同预算均匀网格.png",f"{case_id}: same-budget uniform mesh ({uni[3]} elements)")
              if case_id=="web_circular_opening":
                  plot_mesh(opt[1],opt[2],case_out/f"{label}_孔边局部放大.png",f"{case_id}: hole zoom",(-65,65),(-65,65))
              elif case_id=="diaphragm_multi_opening_budget":
                  plot_mesh(opt[1],opt[2],case_out/f"{label}_三孔区域放大.png",f"{case_id}: openings zoom",(-250,250),(-120,120))
              elif case_id=="bridge_web_crack":
                  plot_mesh(opt[1],opt[2],case_out/f"{label}_裂纹区放大.png",f"{case_id}: crack zoom",(-55,55),(-35,35))
              elif case_id=="bearing_load_introduction":
                  plot_mesh(opt[1],opt[2],case_out/f"{label}_固定端放大.png",f"{case_id}: fixed-end zoom",(-505,-280),(-55,55))

          import zipfile
          zip_path=Path("$RUNNER_TEMP/四案例_live_DS决策链与网格图.zip")
          with zipfile.ZipFile(zip_path,"w",zipfile.ZIP_DEFLATED) as z:
              for p in sorted(out.rglob("*")):
                  if p.is_file(): z.write(p,p.relative_to(out))
          print(zip_path)
          PY
          sed -i "s|\$RUNNER_TEMP|$RUNNER_TEMP|g" "$RUNNER_TEMP/export.py"
          python "$RUNNER_TEMP/export.py"
      - name: Upload compact files
        uses: actions/upload-artifact@v4
        with:
          name: four-live-ds-chains-and-mesh-png
          path: |
            ${{ runner.temp }}/compact
            ${{ runner.temp }}/四案例_live_DS决策链与网格图.zip
          if-no-files-found: error
          retention-days: 90
