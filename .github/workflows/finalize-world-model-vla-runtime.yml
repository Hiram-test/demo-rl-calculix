name: finalize-world-model-vla-runtime  # Name the one-shot runtime-contract and physical-gate workflow.

on:  # Define automatic and manual entry points.
  push:  # Run when this workflow or its paired finalizer is added.
    branches:  # Restrict execution to the dedicated implementation branch.
      - "feat/world-model-vla-bridge-diaphragm-ready3"  # Select the sole writable WM-VLA branch.
    paths:  # Avoid retriggering after self-removal.
      - ".github/workflows/finalize-world-model-vla-runtime.yml"  # Trigger from this one-shot workflow.
      - "scripts/finalize_world_model_vla_runtime.py"  # Trigger from its audited source finalizer.
  workflow_dispatch:  # Permit an explicit rerun if the push event is delayed.

permissions:  # Grant only the repository mutation required after verification.
  contents: write  # Permit the workflow token to finalize and clean the implementation branch.

jobs:  # Define the isolated runtime finalization job.
  finalize-and-gate:  # Adapt interfaces, run native solvers, and persist concise evidence.
    runs-on: ubuntu-latest  # Use a reproducible Linux environment.
    timeout-minutes: 35  # Bound package installation and the coarse three-dimensional campaign.
    steps:  # Execute checkout, source adaptation, unit tests, native smoke, evidence, and cleanup.
      - name: Check out implementation branch  # Materialize the writable branch rather than a detached merge commit.
        uses: actions/checkout@v4  # Use the maintained checkout action.
        with:  # Configure exact branch checkout.
          ref: "feat/world-model-vla-bridge-diaphragm-ready3"  # Select the dedicated implementation branch.
          fetch-depth: 0  # Retain branch history for a normal commit.
      - name: Set up Python  # Select the supported scientific interpreter.
        uses: actions/setup-python@v5  # Use the maintained Python setup action.
        with:  # Configure the interpreter version.
          python-version: "3.11"  # Match the permanent verification workflow.
      - name: Install native finite-element tools  # Install the actual mesher and solver used by the gate.
        run: |  # Execute deterministic Ubuntu package installation.
          sudo apt-get update  # Refresh package metadata.
          sudo apt-get install -y calculix-ccx gmsh libglu1-mesa  # Install CalculiX, Gmsh, and the Gmsh runtime library.
      - name: Apply runtime adapters  # Patch only explicit repository-contract boundaries.
        run: |  # Execute the idempotent source finalizer.
          python scripts/finalize_world_model_vla_runtime.py  # Adapt partition, record, and vision discovery contracts.
      - name: Install repository  # Install Python dependencies and the focused test runner.
        run: |  # Execute deterministic Python installation commands.
          python -m pip install --upgrade pip  # Upgrade the package installer.
          python -m pip install -e . pytest  # Install the editable repository and Pytest.
      - name: Run focused unit gates  # Verify source syntax, world-model purity, and the Dörfler action shield.
        run: |  # Execute the focused deterministic checks.
          python -m py_compile visionamr/vla/world_controller.py  # Compile the canonical controller.
          python -m py_compile visionamr/bridge_diaphragm.py  # Compile the bridge benchmark.
          python -m py_compile scripts/run_world_model_vla_bridge.py  # Compile the held-out campaign.
          python -m pytest -q tests/test_world_controller.py  # Run action, planning, persistence, and independence tests.
      - name: Run real three-dimensional execution gate  # Execute independent transition collection and held-out physical comparison.
        id: bridge_gate  # Expose the command result to later evidence steps.
        continue-on-error: true  # Preserve campaign JSON even when the scientific Dörfler floor fails.
        run: |  # Run a coarse but topologically identical steel-box diaphragm campaign.
          python scripts/run_world_model_vla_bridge.py --smoke --no-reference --train-cases 1 --test-cases 1 --max-solves 3 --horizon 3 --n-eq-cap 60000 --output artifacts/world_model_vla_bridge_smoke  # Execute real Gmsh and CalculiX with the hard floor enabled.
      - name: Write concise gate evidence  # Convert the full campaign JSON and command outcome into a stable review record.
        if: always()  # Preserve diagnostic evidence after any physical-gate outcome.
        run: |  # Execute a line-commented Python evidence writer.
          python - <<'PY'  # Start the deterministic inline evidence program.
          from pathlib import Path  # Import portable path handling.
          import json  # Import structured campaign parsing and evidence serialization.
          source = Path("artifacts/world_model_vla_bridge_smoke/campaign.json")  # Select the canonical physical campaign result.
          payload = json.loads(source.read_text(encoding="utf-8")) if source.exists() else {}  # Read available campaign evidence without inventing values.
          evidence = {"schema": 1, "execution_completed": source.exists(), "dorfler_floor_pass": payload.get("dorfler_floor_pass"), "world_model_advantage_observed": payload.get("world_model_advantage_observed"), "world_model_rows": payload.get("world_model_rows"), "local_prediction_used": payload.get("local_prediction_used"), "test_count": len(payload.get("tests", [])), "source": str(source)}  # Build the concise truthful review record.
          destination = Path("docs/WM_VLA_SOLVER_GATE.json")  # Select the stable committed evidence path.
          destination.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")  # Persist the exact measured gate outcome.
          PY
      - name: Remove temporary finalizers  # Keep the final branch free of source-edit machinery.
        if: always()  # Clean temporary files after both pass and scientific failure outcomes.
        run: |  # Delete only known one-shot maintenance files.
          rm -f scripts/finalize_world_model_vla.py  # Remove the earlier source-contract finalizer when still present.
          rm -f .github/workflows/finalize-world-model-vla.yml  # Remove the earlier one-shot workflow when still present.
          rm -f scripts/finalize_world_model_vla_runtime.py  # Remove this runtime finalizer.
          rm -f .github/workflows/finalize-world-model-vla-runtime.yml  # Remove this one-shot workflow definition.
      - name: Commit finalized runtime and measured evidence  # Persist production sources and the truthful solver-gate record.
        if: always()  # Commit diagnostic evidence even when the physical performance gate fails.
        run: |  # Create and push one auditable branch update.
          git config user.name "github-actions[bot]"  # Set the standard automation author name.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"  # Set the standard automation author email.
          git add -A  # Stage finalized production files, measured evidence, and temporary-file removals.
          git diff --cached --quiet || git commit -m "fix: finalize WM-VLA runtime and record solver gate"  # Commit only a material source or evidence change.
          git push origin HEAD:feat/world-model-vla-bridge-diaphragm-ready3  # Update the sole implementation branch.
      - name: Enforce physical Dörfler floor  # Preserve a red check when the measured campaign is weaker or failed to execute.
        if: steps.bridge_gate.outcome != 'success'  # Evaluate the real campaign command outcome after evidence is safely committed.
        run: |  # Return a deterministic scientific-gate failure.
          exit 2  # Mark the workflow failed without erasing diagnostic artifacts.
      - name: Upload full physical evidence  # Preserve meshes, decks, logs, and the transition library for review.
        if: always()  # Upload artifacts for both success and failure diagnoses.
        uses: actions/upload-artifact@v4  # Use the maintained artifact uploader.
        with:  # Configure the complete campaign payload.
          name: world-model-vla-runtime-gate  # Name the downloadable physical evidence bundle.
          path: artifacts/world_model_vla_bridge_smoke  # Upload the full isolated Gmsh-CalculiX campaign directory.
          if-no-files-found: warn  # Surface an explicit warning when execution failed before artifact creation.
