name: Patch WM-VLA targeted budget certification

on:
  push:
    branches:
      - feat/wm-vla-multistep-bridge3d
    paths:
      - .github/workflows/patch-wm-budget.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wm-vla-multistep-bridge3d
          fetch-depth: 0
      - name: Apply reviewed source substitutions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path  # Locate and patch the reviewed pipeline source deterministically.
          path = Path("visionamr/vla/pipeline_world.py")  # Select the only source file changed by this one-shot patch.
          text = path.read_text(encoding="utf-8")  # Read the complete current pipeline source.
          old_import = "from .tool_contract import MaterializedAction, MeshAction, MeshCertificate, certify_action_mesh  # Enforce deterministic parameter ownership."
          new_import = "from .budget_certificate import certify_action_mesh_targeted  # Use bidirectional exact Gmsh budget targeting before every real solve.\nfrom .tool_contract import MaterializedAction, MeshAction, MeshCertificate  # Enforce deterministic action and certificate ownership."
          if old_import not in text:  # Refuse to patch an unexpected pipeline revision.
              raise RuntimeError("expected tool-contract import was not found")  # Stop before any ambiguous source edit.
          text = text.replace(old_import, new_import, 1)  # Replace the import while preserving line-level comments.
          expected_calls = text.count("certify_action_mesh(")  # Count the two reviewed execution points before substitution.
          if expected_calls != 2:  # Refuse to alter an unexpected number of mesh-certification calls.
              raise RuntimeError(f"expected two certification calls, found {expected_calls}")  # Report source drift explicitly.
          text = text.replace("certify_action_mesh(", "certify_action_mesh_targeted(")  # Route initial and subsequent actions through exact budget targeting.
          text = text.replace("max_mesh_attempts: int = 4  # Bound mesh-only certification calls per executed action.", "max_mesh_attempts: int = 6  # Bound bidirectional exact Gmsh certification calls per executed action.", 1)  # Permit convergence to the declared utilization band.
          path.write_text(text, encoding="utf-8")  # Persist the reviewed deterministic source patch.
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visionamr/vla/pipeline_world.py
          git commit -m "Use bidirectional exact budget targeting in WM-VLA"
          git push origin HEAD:feat/wm-vla-multistep-bridge3d
