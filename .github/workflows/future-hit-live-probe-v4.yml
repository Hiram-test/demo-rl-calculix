name: Future-hit one-probe persistence delegation # 定义一次真实 Dörfler 探针后由 LLM 委派剩余加密深度的实验。
on: # 定义当前实验分支与草稿 PR 的触发条件。
  push: # 在 V4 实验代码或工作流更新时自动运行。
    branches: # 限制可信 push 只来自当前 P-H 分支。
      - experiment/ph-routing-matrix # 指向当前论文实验分支。
    paths: # 仅监听 V4 主体和工作流自身。
      - experiments/future_hit_delegation/run_live_probe_v4.py # 监听一次探针机制委派实现。
      - .github/workflows/future-hit-live-probe-v4.yml # 监听工作流协议自身。
  pull_request: # 让草稿 PR 暴露可读取的运行状态、日志和 Artifact。
    branches: # 对照已有真实 CalculiX 横向通道基准分支。
      - exp/cross-passage-torsion-five-methods # 指向 PR24 数值基线。
    paths: # 仅在 V4 实验协议变化时触发 PR 运行。
      - experiments/future_hit_delegation/run_live_probe_v4.py # 监听 V4 机制委派脚本。
      - .github/workflows/future-hit-live-probe-v4.yml # 监听本工作流。
  workflow_dispatch: # 允许人工复跑冻结的一次探针协议。
permissions: # 定义读取代码与上传制品所需权限。
  contents: read # 本验证工作流不自动写回仓库。
concurrency: # 防止同一 PR 重复消耗模型和有限元预算。
  group: future-hit-live-probe-v4-${{ github.event.pull_request.number || github.ref }} # 按 PR 或分支建立唯一并发组。
  cancel-in-progress: true # 新 V4 提交出现时取消旧运行。
jobs: # 定义一次探针真实模型与 CalculiX 作业。
  probe-live-v4: # 执行动态参照、一次探针、LLM 剩余深度委派与物理审计。
    runs-on: ubuntu-24.04 # 固定与既有真实基准相同的 Ubuntu 环境。
    environment: ds # 复用已有 DeepSeek 受保护 Environment。
    timeout-minutes: 35 # 为高 reasoning token 模型和真实求解设置三十五分钟上限。
    env: # 冻结模型与线性代数运行条件。
      MPLBACKEND: Agg # 使用无头绘图后端兼容既有模块导入。
      OMP_NUM_THREADS: '1' # 限制 OpenMP 并发提高重复性。
      MKL_NUM_THREADS: '1' # 限制 MKL 并发减少运行间差异。
      DEEPSEEK_API_KEY: ${{ secrets.D || secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_KEY || secrets.DEEPSEEK || secrets.API_KEY || secrets.API || secrets.KEY || secrets.TOKEN || secrets.DS || secrets.DS_KEY || secrets.DS_API_KEY || vars.D || vars.DEEPSEEK_API_KEY || vars.DEEPSEEK_KEY || vars.DEEPSEEK || vars.API_KEY || vars.API || vars.KEY || vars.TOKEN || vars.DS || vars.DS_KEY || vars.DS_API_KEY }} # 选择受保护 Environment 中首个可用模型凭据。
      DEEPSEEK_MODEL: deepseek-v4-pro # 保持与 V3 相同的真实推理模型以比较证据增量作用。
    steps: # 定义代码检出、依赖、真实实验、结果验证和制品上传步骤。
      - uses: actions/checkout@v4 # 检出当前 push 或 PR 头分支的确切代码。
        with: # 配置实际实验代码来源。
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }} # PR 时明确使用 experiment/ph-routing-matrix 头分支。
      - uses: actions/setup-python@v5 # 配置固定 Python 3.11 环境。
        with: # 指定验证过的解释器版本。
          python-version: '3.11' # 使用 Python 3.11。
      - name: Compile one-probe experiment # 在安装与真实调用前检查 V4 及依赖模块语法。
        run: python -m py_compile experiments/future_hit_delegation/run.py experiments/future_hit_delegation/run_live_sparse.py experiments/future_hit_delegation/run_live_sparse_v3.py experiments/future_hit_delegation/run_live_probe_v4.py experiments/cross_passage_torsion_benchmark/run_benchmark.py # 编译本轮全部执行模块。
      - name: Install solver and API dependencies # 安装真实 CalculiX、PyTorch、数值库与模型客户端。
        shell: bash # 使用 Bash 执行固定依赖安装流程。
        run: | # 顺序安装 Python 与系统级依赖。
          set -euo pipefail # 任一安装失败立即停止。
          python -m pip install --upgrade pip --quiet # 更新 pip。
          python -m pip install numpy matplotlib openai --quiet # 安装数组、绘图和 DeepSeek 兼容客户端。
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu --quiet # 安装既有正式基准导入所需 CPU PyTorch。
          sudo apt-get update -qq >/tmp/future-hit-v4-apt-update.log 2>&1 # 更新 Ubuntu 包索引并保存日志。
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq calculix-ccx >/tmp/future-hit-v4-apt-install.log 2>&1 # 安装真实 CalculiX 求解器。
      - name: Locate CalculiX executable # 定位标准或版本化真实 ccx 可执行文件。
        id: solver # 保存求解器路径供 V4 实验引用。
        shell: bash # 使用 Bash 完成定位与验证。
        run: | # 先查标准命令再回退搜索版本化文件。
          set -euo pipefail # 找不到真实求解器立即停止。
          CCX_BIN="$(command -v ccx || true)" # 首先搜索标准 ccx 命令。
          if [[ -z "$CCX_BIN" ]]; then CCX_BIN="$(find /usr/bin -maxdepth 1 -type f -name 'ccx*' | sort | head -n 1)"; fi # 标准命令缺失时搜索版本化文件。
          test -x "$CCX_BIN" # 验证定位结果确实可执行。
          echo "ccx=$CCX_BIN" >> "$GITHUB_OUTPUT" # 保存真实 CalculiX 路径。
      - name: Confirm protected model credential # 在消耗模型预算前确认受保护凭据存在。
        run: test -n "$DEEPSEEK_API_KEY" # 仅检查非空且绝不输出凭据。
      - name: Run one-probe persistence delegation # 执行一次标准 Dörfler 物理探针后让 LLM 委派剩余跨轮次资源。
        shell: bash # 使用 Bash 保存真实标准输出和退出码。
        run: | # 清理旧结果后运行冻结 V4 协议。
          set -euo pipefail # 任一求解、模型或 compiler 失败立即停止。
          rm -rf experiments/future_hit_delegation/probe_live_v4_results # 删除旧 V4 结果避免缓存污染。
          python experiments/future_hit_delegation/run_live_probe_v4.py --ccx '${{ steps.solver.outputs.ccx }}' --output experiments/future_hit_delegation/probe_live_v4_results --theta 0.50 --max-rounds 5 2>&1 | tee /tmp/future-hit-live-probe-v4.log # 执行动态参照、探针、LLM 和物理审计。
      - name: Validate one-probe scientific contract # 验证探针响应、模型最终答案、剩余深度预测和真实终态均存在。
        shell: bash # 使用 Bash 启动只读机器结果检查。
        run: | # 对结果执行硬科学合同验证。
          set -euo pipefail # 任一证据缺失立即拒绝本轮结果。
          python - <<'PY' # 使用内联 Python 检查结果结构。
          import json  # 读取 V4 机器结果。
          from pathlib import Path  # 稳定定位结果目录。
          root = Path('experiments/future_hit_delegation/probe_live_v4_results')  # 定义 V4 结果根目录。
          data = json.loads((root / 'results.json').read_text(encoding='utf-8'))  # 读取探针证据与真实执行结果。
          assert len(data['prediction_remaining_depth']) == 16  # 验证 deterministic compiler 生成完整剩余动作。
          assert len(data['marked_after_probe']) > 0  # 验证第一层真实 FEA 确实产生刷新后的 Dörfler 支撑。
          assert len(data['api_audit']) >= 1  # 验证 reasoning-token 使用与完成原因已记录。
          assert (root / 'probe_evidence_packet.json').is_file()  # 验证不含 oracle 标签的真实探针证据已保存。
          PY
      - name: Upload one-probe evidence # 无论成功失败都保存真实模型、探针前后 CalculiX 和数值审计证据。
        if: always() # 确保失败时仍保留所有已生成诊断文件。
        uses: actions/upload-artifact@v4 # 使用官方 Artifact 上传完整 V4 制品。
        with: # 配置制品名称、上传路径和保留期限。
          name: future-hit-live-probe-v4-evidence # 使用独立名称避免和 one-shot V3 混淆。
          path: | # 上传结果目录、运行日志与依赖日志。
            experiments/future_hit_delegation/probe_live_v4_results/
            /tmp/future-hit-live-probe-v4.log
            /tmp/future-hit-v4-apt-install.log
          if-no-files-found: warn # 早期失败时仍上传可用诊断。
          retention-days: 14 # 保留十四天供方法复核和下一批实验比较。
